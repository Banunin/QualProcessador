<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/icon.ico" type="image/x-icon">
    <title>Artigos de Hardware - QualProcessador</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background-color: #f4f7fa; color: #0f172a; margin: 0; padding: 0; }

        .hero-magazine { background: #0f172a; color: white; padding: 50px 40px; text-align: center; }
        .hero-magazine h1 { margin: 0; font-size: 2.5rem; font-weight: 800; }
        .hero-magazine p { margin: 10px 0 25px 0; color: #94a3b8; font-size: 1.05rem; }

        /* Barra de Busca de Artigos */
        .search-magazine { max-width: 600px; margin: 0 auto; display: flex; gap: 10px; }
        .search-magazine input { flex: 1; padding: 14px 20px; border-radius: 8px; border: none; font-family: 'Poppins', sans-serif; font-size: 1rem; outline: none; }
        .search-magazine button { padding: 0 25px; border-radius: 8px; border: none; background: #38bdf8; color: #0f172a; font-weight: 800; cursor: pointer; transition: opacity 0.2s; }
        .search-magazine button:hover { opacity: 0.9; }

        .portal-nav { background-color: white; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 5; }
        .nav-container { max-width: 1400px; margin: 0 auto; padding: 0 40px; display: flex; gap: 5px; }
        .nav-link { padding: 20px 25px; color: #475569; text-decoration: none; font-weight: 700; font-size: 0.95rem; border-bottom: 3px solid transparent; }
        .nav-link:hover, .nav-link.active { color: #38bdf8; border-bottom-color: #38bdf8; background-color: #f8fafc; }

        .container { width: 100%; max-width: 1200px; margin: 40px auto; padding: 0 20px; }

        /* LISTA DE ARTIGOS/ANÁLISES */
        .articles-list { display: flex; flex-direction: column; gap: 30px; }
        
        .article-card-horizontal {
            display: flex;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(15, 23, 42, 0.03);
            border: 1px solid #e2e8f0;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: inherit;
            height: 220px;
        }
        .article-card-horizontal:hover { transform: translateY(-4px); box-shadow: 0 12px 25px rgba(15, 23, 42, 0.08); border-color: #cbd5e1; }
        
        .article-image { width: 350px; background-size: cover; background-position: center; background-color: #e2e8f0; }
        
        .article-content { padding: 30px; display: flex; flex-direction: column; justify-content: center; flex: 1; }
        .article-tag { font-size: 0.8rem; font-weight: 800; color: #ef4444; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .article-content h2 { margin: 0 0 10px 0; font-size: 1.6rem; font-weight: 800; color: #0f172a; line-height: 1.2; }
        .article-content p { margin: 0; color: #64748b; font-size: 0.95rem; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .article-meta { margin-top: 15px; font-size: 0.85rem; color: #94a3b8; font-weight: 600; display: flex; gap: 15px; }

        footer { text-align: center; padding: 40px; color: #64748b; border-top: 1px solid #e2e8f0; font-size: 0.85rem; margin-top: 60px; }

        @media (max-width: 768px) {
            .article-card-horizontal { flex-direction: column; height: auto; }
            .article-image { width: 100%; height: 200px; }
        }
    </style>
</head>
<body>

    <header class="hero-magazine">
        <h1>Artigos</h1>
        <p>Testes de desempenho práticos, benchmarks e vereditos editoriais.</p>
        
        <div class="search-magazine">
            <input type="text" placeholder="Buscar por Artigos">
            <button>Procurar</button>
        </div>
    </header>

    <nav class="portal-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-link">Home</a>
            <a href="analises.html" class="nav-link active">Artigos</a>
            <a href="forum.html" class="nav-link">Fórum</a>
            <a href="comunidade.html" class="nav-link">Comunidade</a>
            <a href="ferramentas.html" class="nav-link">Ferramentas</a>
        </div>
    </nav>

    <div class="container">
        <div class="articles-list" id="articles-list">
            <div style="background:white; border:1px solid #e2e8f0; border-radius:12px; padding:30px; text-align:center; color:#64748b;">Carregando artigos...</div>
        </div>
    </div>

    <footer>&copy; 2026 QualProcessador</footer>

    <script>
        function escapeHTML(str) {
            return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        let artigosCache = [];
        const listaEl = document.getElementById('articles-list');
        const buscaEl = document.querySelector('.search-magazine input');
        const buscaBtn = document.querySelector('.search-magazine button');

        function renderizarArtigos(filtro = '') {
            const termo = filtro.trim().toLowerCase();
            const filtrados = artigosCache.filter(a => [a.titulo, a.descricao, a.categoria, a.autor].join(' ').toLowerCase().includes(termo));

            if (!filtrados.length) {
                listaEl.innerHTML = '<div style="background:white;border:1px solid #e2e8f0;border-radius:12px;padding:30px;text-align:center;color:#64748b;">Nenhum artigo encontrado.</div>';
                return;
            }

            listaEl.innerHTML = filtrados.map(a => {
                const url = a.urlLimpa || a.linkLeitura || `/artigo/${encodeURIComponent(a.id)}`;
                const imagem = a.imagemCapa ? `background-image:url('${String(a.imagemCapa).replace(/'/g, '%27')}')` : "background-image:url('/img/placeholder.webp')";
                return `
                    <a href="${escapeHTML(url)}" class="article-card-horizontal">
                        <div class="article-image" style="${imagem};"></div>
                        <div class="article-content">
                            <span class="article-tag">${escapeHTML(a.categoria || 'Artigo')}</span>
                            <h2>${escapeHTML(a.titulo || 'Sem título')}</h2>
                            <p>${escapeHTML(a.descricao || '')}</p>
                            <div class="article-meta">
                                <span>${escapeHTML(a.autor || 'Equipe QualProcessador')}</span>
                                <span>Leitura: ${escapeHTML(a.tempoLeitura || '—')}</span>
                            </div>
                        </div>
                    </a>`;
            }).join('');
        }

        fetch('/artigos.json', { cache: 'no-store' })
            .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
            .then(obj => {
                artigosCache = Object.values(obj).sort((a,b) => Number(b.id || 0) - Number(a.id || 0));
                renderizarArtigos();
            })
            .catch(err => {
                console.error('Erro ao carregar artigos:', err);
                listaEl.innerHTML = '<div style="background:#fff1f2;border:1px solid #fecdd3;border-radius:12px;padding:30px;text-align:center;color:#be123c;">Não foi possível carregar os artigos.</div>';
            });

        buscaEl.addEventListener('input', () => renderizarArtigos(buscaEl.value));
        buscaEl.addEventListener('keydown', e => { if (e.key === 'Enter') renderizarArtigos(buscaEl.value); });
        buscaBtn.addEventListener('click', () => renderizarArtigos(buscaEl.value));
    </script>

</body>
</html>
