name: Fill missing CPU-Z scores from official Validator once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fill-cpuz-official-missing-once.yml'
permissions:
  contents: write
jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fill only N/A scores from CPU-Z Validator
        run: |
          python3 - <<'PY'
          import json,re,time,urllib.request,urllib.error,unicodedata
          from html.parser import HTMLParser
          from pathlib import Path

          DATA=Path('dados.js')
          raw=DATA.read_text(encoding='utf-8')
          a,b=raw.find('['),raw.rfind(']')
          cpus=json.loads(raw[a:b+1])
          BASE='https://valid.x86.fr/bench/gdfkjm'

          class TextParser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.parts=[]
              def handle_data(self,data):
                  s=' '.join(data.split())
                  if s:self.parts.append(s)

          def norm(s):
              s=unicodedata.normalize('NFKD',str(s)).encode('ascii','ignore').decode().lower()
              s=s.replace('®','').replace('™','')
              return re.sub(r'[^a-z0-9]+','',s)

          def missing(v):
              return v is None or str(v).strip()=='' or str(v).strip().upper()=='N/A'

          def fetch(thread_count):
              url=f'{BASE}/{thread_count}'
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; QualProcessador CPU-Z official-data verifier)'})
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(req,timeout=30) as r:
                          html=r.read().decode('utf-8','ignore')
                          if r.status!=200:return None,url,f'HTTP {r.status}'
                          if 'CPU-Z Benchmark (x64 - 2017.1)' not in html:
                              return None,url,'not CPU-Z Benchmark 2017.1'
                          return html,url,'ok'
                  except urllib.error.HTTPError as e:
                      if e.code in (429,500,502,503,504) and attempt<3:
                          time.sleep(2*(attempt+1)); continue
                      return None,url,f'HTTP {e.code}'
                  except Exception as e:
                      if attempt<3:
                          time.sleep(2*(attempt+1)); continue
                      return None,url,type(e).__name__
              return None,url,'failed'

          def ranking_map(html, known_names):
              p=TextParser(); p.feed(html); parts=p.parts
              known={norm(n):n for n in known_names}
              out={}
              # The ranking is rendered as CPU-name text followed by a numeric score.
              # Ignore '(YOU)' entries and headings by requiring exact normalized model text
              # and a standalone numeric token immediately after it (within 3 text nodes).
              for i,x in enumerate(parts):
                  if '(YOU)' in x.upper():
                      continue
                  nx=norm(x)
                  if nx not in known:
                      continue
                  for y in parts[i+1:min(i+4,len(parts))]:
                      if re.fullmatch(r'\d+(?:\.\d+)?',y):
                          score=int(round(float(y)))
                          if score>0:
                              # Keep first proper ranking-row occurrence; headings don't have
                              # a standalone numeric token right after the model name.
                              out.setdefault(nx,score)
                          break
                      # If we reached another CPU-like text, this was not a row.
                      if norm(y) in known:
                          break
              return out

          names=[c['nome'] for c in cpus]
          need_single=[c for c in cpus if missing(c.get('notaJogos'))]
          need_multi=[c for c in cpus if missing(c.get('notaTrabalho'))]
          print('CPUS',len(cpus),'SINGLE_NA_BEFORE',len(need_single),'MULTI_NA_BEFORE',len(need_multi))

          html1,url1,reason=fetch(1)
          if not html1:
              raise SystemExit(f'Official CPU-Z single-thread page unavailable: {url1} {reason}')
          single_map=ranking_map(html1,names)
          print('OFFICIAL_SINGLE_ROWS_MATCHED',len(single_map),url1)

          thread_counts=sorted({int(str(c.get('threads','0')).strip()) for c in need_multi if str(c.get('threads','')).strip().isdigit() and int(str(c.get('threads')).strip())>0})
          multi_maps={}
          for t in thread_counts:
              html,url,reason=fetch(t)
              if not html:
                  print('MULTI_PAGE_SKIP',t,reason,url)
                  continue
              multi_maps[t]=ranking_map(html,names)
              print('MULTI_PAGE',t,'MATCHED',len(multi_maps[t]),url)
              time.sleep(.12)

          updates={}
          single_added=0; multi_added=0
          for c in cpus:
              n=norm(c['nome'])
              vals={}
              if missing(c.get('notaJogos')) and n in single_map:
                  vals['notaJogos']=single_map[n]; single_added+=1
              if missing(c.get('notaTrabalho')):
                  ts=str(c.get('threads','')).strip()
                  if ts.isdigit():
                      t=int(ts)
                      score=multi_maps.get(t,{}).get(n)
                      if score:
                          vals['notaTrabalho']=score; multi_added+=1
              if vals: updates[c['nome']]=vals

          def object_span(text,cpu_name):
              needle='"nome": '+json.dumps(cpu_name,ensure_ascii=False)
              pos=text.find(needle)
              if pos<0:return None
              start=text.rfind('\n    {',0,pos)
              if start<0:start=text.rfind('{',0,pos)
              end=text.find('\n    },',pos)
              if end<0:
                  end=text.find('\n    }',pos)
                  if end<0:return None
                  end+=len('\n    }')
              else:end+=len('\n    }')
              return start,end

          original=raw
          for c in cpus:
              vals=updates.get(c['nome'])
              if not vals:continue
              span=object_span(raw,c['nome'])
              if not span:
                  print('OBJECT_NOT_FOUND',c['nome']); continue
              start,end=span; block=raw[start:end]
              for field,value in vals.items():
                  old=c.get(field)
                  # Double safety: only replace literal N/A/empty/null-equivalent values.
                  if not missing(old):
                      continue
                  pattern=rf'("{field}"\s*:\s*)("N/A"|null|""|\'\')'
                  new_block,nsub=re.subn(pattern,lambda m:m.group(1)+str(int(value)),block,count=1)
                  if not nsub:
                      print('FIELD_NOT_REPLACED',c['nome'],field,repr(old)); continue
                  block=new_block
                  print('FILLED',field,'|',c['nome'],'|',value,'| SOURCE=valid.x86.fr CPU-Z Benchmark x64 2017.1')
              raw=raw[:start]+block+raw[end:]

          if raw!=original:
              DATA.write_text(raw,encoding='utf-8')

          # Re-parse and report remaining gaps.
          t=DATA.read_text(encoding='utf-8'); x,y=t.find('['),t.rfind(']'); after=json.loads(t[x:y+1])
          single_left=sum(missing(c.get('notaJogos')) for c in after)
          multi_left=sum(missing(c.get('notaTrabalho')) for c in after)
          print('SUMMARY SINGLE_ADDED=',single_added,'MULTI_ADDED=',multi_added,'SINGLE_NA_LEFT=',single_left,'MULTI_NA_LEFT=',multi_left)
          print('SOURCE_POLICY=ONLY https://valid.x86.fr CPU-Z Validator; no CPU-Monkey; no estimates; only x64 2017.1 ranking rows')
          PY
      - name: Validate dados.js
        run: node --check dados.js
      - name: Commit official CPU-Z values
        run: |
          if git diff --quiet dados.js; then echo 'No verified missing values found'; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados.js
          git commit -m "Fill missing CPU-Z scores from official Validator"
          git pull --rebase origin main
          git push origin main
