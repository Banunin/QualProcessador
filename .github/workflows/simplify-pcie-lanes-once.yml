name: Simplify PCIe lane counts once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/simplify-pcie-lanes-once.yml'
permissions:
  contents: write
jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simplify PCIe lane counts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              '28 total / 24 utilizáveis': '24',
              '24 total / 20 utilizáveis': '20',
              '20 total / 16 utilizáveis': '16',
          }

          for filename in ['dados.js', 'gerar_dados.py']:
              p = Path(filename)
              s = p.read_text(encoding='utf-8')
              before = s
              for old, new in replacements.items():
                  s = s.replace(old, new)
              if s != before:
                  p.write_text(s, encoding='utf-8')
                  print(f'Atualizado: {filename}')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/simplify-pcie-lanes-once.yml
          git add dados.js gerar_dados.py
          git commit -m "Simplify PCIe lane counts"
          git push
