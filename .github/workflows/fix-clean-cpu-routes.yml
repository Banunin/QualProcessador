name: Fix clean CPU routes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-clean-cpu-routes.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve CPU slug from browser pathname
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('detalhes.html')
          s = p.read_text(encoding='utf-8')
          old = """        const parametrosUrl = new URLSearchParams(window.location.search);
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        const marca = urlParams.get('marca');
        const cpuSlug = urlParams.get('cpu');

        if (marca && cpuSlug) {
            const urlAmigavel = `/cpu/${marca.toLowerCase()}/${cpuSlug}`;
            window.history.replaceState({ id: id }, '', urlAmigavel);
        }
"""
          new = """        const parametrosUrl = new URLSearchParams(window.location.search);
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        let marca = urlParams.get('marca');
        let cpuSlug = urlParams.get('cpu');

        // Em URLs limpas da Vercel (/cpu/marca/modelo), os parâmetros do rewrite
        // não aparecem em location.search. Recupera marca e slug diretamente do caminho.
        const partesCaminhoCpu = window.location.pathname.split('/').filter(Boolean);
        if ((!marca || !cpuSlug) && partesCaminhoCpu[0] === 'cpu' && partesCaminhoCpu.length >= 3) {
            marca = partesCaminhoCpu[1];
            cpuSlug = partesCaminhoCpu.slice(2).join('/');
        }

        if (marca && cpuSlug && partesCaminhoCpu[0] !== 'cpu') {
            const urlAmigavel = `/cpu/${marca.toLowerCase()}/${cpuSlug}`;
            window.history.replaceState({ id: id }, '', urlAmigavel);
        }
"""
          if old not in s:
              raise SystemExit('Bloco de roteamento esperado não encontrado em detalhes.html')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit route fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add detalhes.html
          git commit -m "Resolve CPU fichas from clean URL slugs"
          git push
