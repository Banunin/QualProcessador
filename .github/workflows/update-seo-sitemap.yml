name: Update SEO and AI discovery
on:
  push:
    branches: [main]
    paths:
      - 'dados.json'
      - 'migrar_dados_json.py'
      - 'finalizar_descoberta_dados.py'
      - 'schemas/processadores.schema.json'
      - 'artigos.json'
      - 'gerar_sitemap_seo.py'
      - 'gerar_ai_discovery.py'
      - 'sincronizar_rotas_artigos.py'
      - 'lib/ai-utils.js'
      - 'lib/image-semantics.js'
      - 'api/ai-cpus.js'
      - 'api/cpu.js'
      - 'api/search.js'
      - 'api/comparison.js'
      - 'api/dados-compat.js'
      - 'api/render-cpu.js'
      - 'api/ai-images.js'
      - 'scripts/validate-machine-layer.js'
      - 'vercel.json'
      - '.github/workflows/update-seo-sitemap.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize canonical CPU dataset and build temporary frontend adapter
        run: python3 migrar_dados_json.py
      - name: Validate machine-readable knowledge layer
        run: |
          node --check lib/ai-utils.js
          node --check api/ai-cpus.js
          node --check api/cpu.js
          node --check api/search.js
          node --check api/comparison.js
          node --check api/dados-compat.js
          node --check api/render-cpu.js
          node scripts/validate-machine-layer.js
      - name: Generate XML sitemap
        env:
          SEO_BASE_URL: https://qualprocessador.vercel.app
        run: python3 gerar_sitemap_seo.py
      - name: Generate AI discovery files
        env:
          SEO_BASE_URL: https://qualprocessador.vercel.app
        run: python3 gerar_ai_discovery.py
      - name: Advertise canonical dataset and knowledge APIs
        env:
          SEO_BASE_URL: https://qualprocessador.vercel.app
        run: python3 finalizar_descoberta_dados.py
      - name: Synchronize SSR article routes
        run: python3 sincronizar_rotas_artigos.py
      - name: Remove temporary compatibility artifact
        run: rm -f dados.js
      - name: Commit generated knowledge, discovery and routes when changed
        run: |
          git add dados.json sitemap.xml sitemap.md llms.txt ai-index.json image-index.json feed.xml vercel.json
          if git diff --cached --quiet; then
            echo "Knowledge layer, SEO, AI discovery, image semantics and SSR routes already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update canonical knowledge layer and machine discovery"
          git push
