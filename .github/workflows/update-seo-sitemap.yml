name: Update SEO and AI discovery
on:
  push:
    branches: [main]
    paths:
      - 'dados.js'
      - 'dados.json'
      - 'migrar_dados_json.py'
      - 'schemas/processadores.schema.json'
      - 'artigos.json'
      - 'gerar_sitemap_seo.py'
      - 'gerar_ai_discovery.py'
      - 'sincronizar_rotas_artigos.py'
      - 'lib/image-semantics.js'
      - 'api/ai-images.js'
      - '.github/workflows/update-seo-sitemap.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build canonical CPU JSON dataset
        run: python3 migrar_dados_json.py
      - name: Validate canonical CPU JSON dataset
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('dados.json').read_text(encoding='utf-8'))
          assert data['dataset'] == 'QualProcessador CPU Database'
          assert isinstance(data['processors'], list) and data['processors']
          assert data['count'] == len(data['processors'])
          assert data['benchmark_semantics']['notaJogos'] == 'CPU-Z Benchmark 17 Single Thread'
          assert data['benchmark_semantics']['notaTrabalho'] == 'CPU-Z Benchmark 17 Multi Thread'
          print(f"dados.json válido: {data['count']} processadores")
          PY
      - name: Generate XML sitemap
        env:
          SEO_BASE_URL: https://qualprocessador.vercel.app
        run: python3 gerar_sitemap_seo.py
      - name: Generate AI discovery files
        env:
          SEO_BASE_URL: https://qualprocessador.vercel.app
        run: python3 gerar_ai_discovery.py
      - name: Synchronize SSR article routes
        run: python3 sincronizar_rotas_artigos.py
      - name: Commit generated discovery files and routes when changed
        run: |
          git add dados.json sitemap.xml sitemap.md llms.txt ai-index.json image-index.json feed.xml vercel.json
          if git diff --cached --quiet; then
            echo "CPU JSON, SEO, AI discovery, image semantics and SSR routes already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update canonical CPU JSON and machine discovery"
          git push
