name: Update SEO and AI discovery
on:
  push:
    branches: [main]
    paths:
      - 'dados.js'
      - 'artigos.json'
      - 'gerar_sitemap_seo.py'
      - 'gerar_ai_discovery.py'
      - 'sincronizar_rotas_artigos.py'
      - '.github/workflows/update-seo-sitemap.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate XML sitemap
        env:
          SEO_BASE_URL: https://qualprocessador.vercel.app
        run: python3 gerar_sitemap_seo.py
      - name: Generate AI discovery files
        env:
          SEO_BASE_URL: https://qualprocessador.vercel.app
        run: python3 gerar_ai_discovery.py
      - name: Synchronize SSR article routes
        run: python3 sincronizar_rotas_artigos.py
      - name: Commit generated discovery files and routes when changed
        run: |
          git add sitemap.xml sitemap.md llms.txt ai-index.json feed.xml vercel.json
          if git diff --cached --quiet; then
            echo "SEO, AI discovery and SSR article routes already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update SEO, AI discovery and SSR article routes"
          git push
