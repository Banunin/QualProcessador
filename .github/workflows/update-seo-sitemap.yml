name: Update SEO and AI discovery
on:
  push:
    branches: [main]
    paths:
      - 'dados.js'
      - 'artigos.json'
      - 'gerar_sitemap_seo.py'
      - 'gerar_ai_discovery.py'
      - '.github/workflows/update-seo-sitemap.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate XML sitemap
        env:
          SEO_BASE_URL: https://qualprocessador.com
        run: python3 gerar_sitemap_seo.py
      - name: Generate AI discovery files
        env:
          SEO_BASE_URL: https://qualprocessador.com
        run: python3 gerar_ai_discovery.py
      - name: Commit generated discovery files when changed
        run: |
          git add sitemap.xml sitemap.md llms.txt ai-index.json feed.xml
          if git diff --cached --quiet; then
            echo "SEO and AI discovery files already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update SEO and AI discovery from site data"
          git push
