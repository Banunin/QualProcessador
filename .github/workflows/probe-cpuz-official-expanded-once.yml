name: Probe expanded official CPU-Z rankings once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-cpuz-official-expanded-once.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Cross-check missing fields against official CPUID Validator
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,unicodedata
          from html.parser import HTMLParser
          from pathlib import Path
          t=Path('dados.js').read_text(encoding='utf-8'); a,b=t.find('['),t.rfind(']'); cpus=json.loads(t[a:b+1])
          def miss(v): return v is None or str(v).strip()=='' or str(v).strip().upper()=='N/A'
          def norm(s):
              s=unicodedata.normalize('NFKD',str(s)).encode('ascii','ignore').decode().lower()
              s=s.replace('®','').replace('™','')
              s=re.sub(r'\b(?:intel|amd)\b',' ',s)
              s=re.sub(r'\b(?:processor|cpu)\b',' ',s)
              s=re.sub(r'\bwith\s+radeon(?:\s+graphics)?\b',' ',s)
              s=re.sub(r'\b\d+\s*-?core\b',' ',s)
              s=re.sub(r'[^a-z0-9]+','',s)
              return s
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.parts=[]
              def handle_data(self,d):
                  x=' '.join(d.split())
                  if x:self.parts.append(x)
          def fetch(n):
              url=f'https://valid.cpuid.com/bench/{n}'
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (QualProcessador official CPU-Z verifier)'})
              with urllib.request.urlopen(req,timeout=30) as r: html=r.read().decode('utf-8','ignore')
              if 'x64 - 2017.1' not in html and 'CPU-Z Benchmark' not in html: raise RuntimeError('unexpected benchmark page '+url)
              return html,url
          def rows(html):
              p=P(); p.feed(html); x=p.parts; out=[]
              for i in range(len(x)-2):
                  # Current CPUID layout is rank, CPU name, score in adjacent text nodes.
                  if re.fullmatch(r'\d+',x[i]) and not re.fullmatch(r'\d+(?:\.\d+)?',x[i+1]) and re.fullmatch(r'\d+(?:\.\d+)?',x[i+2]):
                      out.append((x[i+1],int(round(float(x[i+2])))))
                  # Fallback for compact nodes such as "1 Intel Core ... 948".
                  m=re.match(r'^\d+\s+(.+?)\s+(\d+(?:\.\d+)?)$',x[i])
                  if m: out.append((m.group(1),int(round(float(m.group(2))))))
              # de-dup exact names preserving first
              seen=set(); z=[]
              for name,score in out:
                  k=(name,score)
                  if k not in seen: seen.add(k); z.append((name,score))
              return z
          pages={}
          for n in [1,2,4,6,8,12,16,20,24,32,36]:
              try:
                  h,u=fetch(n); rr=rows(h); pages[n]=rr; print('PAGE',n,'ROWS',len(rr),u)
              except Exception as e: print('PAGE_FAIL',n,type(e).__name__,e)
          idx={n:{} for n in pages}
          ambiguous={}
          for n,rr in pages.items():
              for raw,score in rr:
                  k=norm(raw)
                  if not k: continue
                  idx[n].setdefault(k,[]).append((raw,score))
          addS=addM=0
          for c in cpus:
              k=norm(c['nome']); th=int(c['threads']) if str(c.get('threads','')).isdigit() else None
              if miss(c.get('notaJogos')):
                  cand=idx.get(1,{}).get(k,[])
                  vals=sorted(set(v for _,v in cand))
                  if len(vals)==1:
                      print('PROPOSE_SINGLE',c['nome'],'=',vals[0],'MATCH=',cand); addS+=1
                  elif len(vals)>1: print('AMBIG_SINGLE',c['nome'],cand)
              if miss(c.get('notaTrabalho')) and th:
                  cand=idx.get(th,{}).get(k,[])
                  vals=sorted(set(v for _,v in cand))
                  if len(vals)==1:
                      print('PROPOSE_MULTI',c['nome'],'=',vals[0],'threads=',th,'MATCH=',cand); addM+=1
                  elif len(vals)>1: print('AMBIG_MULTI',c['nome'],cand)
          print('PROPOSED_SINGLE',addS,'PROPOSED_MULTI',addM)
          PY
