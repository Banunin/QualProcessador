name: Improve InfinitePay checkout feedback
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-infinitepay-errors.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Apoiar checkout errors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apoiar.html')
          s = p.read_text(encoding='utf-8')
          old = """    const data = await response.json();
    if(!response.ok || !data.checkoutUrl) throw new Error(data.error || 'Falha ao criar checkout');
    location.href=data.checkoutUrl;
  }catch(error){
    statusEl.className='status-msg show warn';
    statusEl.textContent='Pagamento ainda não configurado ou indisponível. Verifique sua InfiniteTag da InfinitePay.';
  }
"""
          new = """    const data = await response.json().catch(()=>({}));
    if(!response.ok || !data.checkoutUrl){
      const message = data.error || 'Falha ao criar checkout InfinitePay.';
      throw new Error(message);
    }
    location.href=data.checkoutUrl;
  }catch(error){
    statusEl.className='status-msg show warn';
    statusEl.textContent=error.message || 'Não foi possível abrir o checkout da InfinitePay.';
  }
"""
          if old not in s:
              raise SystemExit('Trecho esperado não encontrado em apoiar.html')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apoiar.html
          git commit -m "Show real InfinitePay checkout errors"
          git push
