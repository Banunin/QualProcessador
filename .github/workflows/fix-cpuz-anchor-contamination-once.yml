name: Correct CPU-Z anchor contamination once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-cpuz-anchor-contamination-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct i5-12400F to official ranking reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('dados.js')
          s=p.read_text(encoding='utf-8')
          m=re.search(r'(\{[^{}]*"nome"\s*:\s*"Intel Core i5-12400F".*?\n\s*\})',s,re.S)
          if not m:
              raise SystemExit('i5-12400F block not found')
          block=m.group(1)
          if '"notaJogos": 758' not in block:
              print('No 758 contamination found; nothing to change')
          else:
              new=block.replace('"notaJogos": 758','"notaJogos": 644',1)
              s=s[:m.start(1)]+new+s[m.end(1):]
              p.write_text(s,encoding='utf-8')
              print('Corrected Intel Core i5-12400F notaJogos 758 -> 644')
              print('Source: CPU-Z Validator x64 2017.1 official ranking row, not (YOU) validation')
          PY
          node --check dados.js
      - name: Commit correction
        run: |
          if git diff --quiet dados.js; then echo 'No correction needed'; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados.js
          git commit -m "Correct i5-12400F CPU-Z official reference score"
          git pull --rebase origin main
          git push origin main
