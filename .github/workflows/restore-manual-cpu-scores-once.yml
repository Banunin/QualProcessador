name: Audit CPU score history once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-manual-cpu-scores-once.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare current scores with human-edited history
        run: |
          python3 - <<'PY'
          import json, subprocess
          from collections import defaultdict
          from pathlib import Path

          def parse(text):
              a,b=text.find('['),text.rfind(']')
              return json.loads(text[a:b+1])
          def missing(v):
              return v is None or str(v).strip()=='' or str(v).strip().upper()=='N/A'
          def num(v):
              try:return float(v)
              except:return None
          def cpuz_like(v):
              n=num(v)
              return n is not None and n >= 100

          current=parse(Path('dados.js').read_text(encoding='utf-8'))
          log=subprocess.check_output(['git','log','--format=%H|%an|%ae|%ad','--date=iso-strict','--','dados.js'],text=True,encoding='utf-8').splitlines()
          history=[]
          for row in log:
              sha,author,email,date=row.split('|',3)
              if 'github-actions' in email.lower() or '[bot]' in author.lower():
                  continue
              try:
                  text=subprocess.check_output(['git','show',f'{sha}:dados.js'],text=True,encoding='utf-8',stderr=subprocess.DEVNULL)
                  data=parse(text)
              except Exception:
                  continue
              history.append((sha,author,date,{str(c.get('id')):c for c in data}))

          lines=[]
          lines.append('CPU SCORE HISTORY AUDIT')
          lines.append('Current file: dados.js')
          lines.append(f'Current CPUs: {len(current)}')
          lines.append(f'Human historical snapshots inspected: {len(history)}')
          lines.append('')

          suspicious=[]
          for c in current:
              for field in ('notaJogos','notaTrabalho'):
                  v=c.get(field); n=num(v)
                  if not missing(v) and (n is None or n < 100):
                      suspicious.append((c,field,v))

          lines.append(f'SUSPICIOUS LOW/OLD-SCALE FIELDS: {len(suspicious)}')
          for c,field,v in suspicious:
              cid=str(c.get('id')); candidates=[]; seen=set()
              for sha,author,date,index in history:
                  old=index.get(cid)
                  if not old or old.get('nome')!=c.get('nome'): continue
                  ov=old.get(field)
                  if cpuz_like(ov) and str(ov) not in seen:
                      seen.add(str(ov)); candidates.append((ov,sha[:10],date,author))
              cand='; '.join(f'{x[0]} @ {x[1]} {x[2]} ({x[3]})' for x in candidates[:8]) or 'NO CPU-Z-LIKE HUMAN VALUE FOUND'
              lines.append(f'{cid} | {c.get("nome")} | {field}={v} | history: {cand}')
          lines.append('')

          pairs=defaultdict(list)
          for c in current:
              s,m=c.get('notaJogos'),c.get('notaTrabalho')
              if cpuz_like(s) and cpuz_like(m): pairs[(str(s),str(m))].append(c)
          dup=[(p,cs) for p,cs in pairs.items() if len(cs)>1]
          lines.append(f'DUPLICATE COMPLETE CPU-Z-LIKE PAIRS: {len(dup)}')
          for (s,m),cs in sorted(dup,key=lambda x:(-len(x[1]),x[0])):
              lines.append(f'PAIR {s}/{m}: ' + '; '.join(f'{c.get("id")} {c.get("nome")}' for c in cs))
              for c in cs:
                  cid=str(c.get('id')); hist=[]; seen=set()
                  for sha,author,date,index in history:
                      old=index.get(cid)
                      if not old or old.get('nome')!=c.get('nome'): continue
                      os,om=old.get('notaJogos'),old.get('notaTrabalho')
                      if cpuz_like(os) and cpuz_like(om) and (str(os),str(om)) not in seen:
                          seen.add((str(os),str(om))); hist.append(f'{os}/{om} @ {sha[:10]}')
                  lines.append(f'  {c.get("nome")}: ' + ('; '.join(hist[:8]) or 'no complete CPU-Z-like human pair'))
          lines.append('')
          lines.append('NOTE: This audit does not modify dados.js.')
          Path('cpu-score-audit.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('\n'.join(lines[:120]))
          PY
      - name: Commit audit report only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cpu-score-audit.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit CPU score history without changing data"
          git pull --rebase origin main
          git push origin main
