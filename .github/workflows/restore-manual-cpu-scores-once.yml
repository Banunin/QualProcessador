name: Fix legacy CPU score scale once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-manual-cpu-scores-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix only verified legacy score fields and add guards
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path

          fixes={
            15:{'nome':'AMD Ryzen 3 3100','notaJogos':457,'notaTrabalho':2562},
            32:{'nome':'AMD Ryzen 7 4700G','notaJogos':527,'notaTrabalho':5656},
            42:{'nome':'AMD Ryzen 7 5700X','notaJogos':625,'notaTrabalho':5885},
          }

          p=Path('dados.js'); text=p.read_text(encoding='utf-8')
          a,b=text.find('['),text.rfind(']'); data=json.loads(text[a:b+1])
          byid={int(c['id']):c for c in data}
          for cid,want in fixes.items():
              c=byid.get(cid)
              if not c or c.get('nome')!=want['nome']:
                  raise RuntimeError(f'Unexpected CPU at id {cid}: {c and c.get("nome")}')

          out=text
          for cid,want in fixes.items():
              m=re.search(r'\n    \{\n        "id":\s*'+str(cid)+r',',out)
              if not m: raise RuntimeError(f'Block {cid} not found')
              nxt=re.search(r'\n    \{\n        "id":\s*\d+,',out[m.end():])
              end=m.end()+nxt.start() if nxt else out.rfind('\n];')
              block=out[m.start():end]
              for field in ('notaJogos','notaTrabalho'):
                  pat=re.compile(r'("'+field+r'"\s*:\s*)("[^"]*"|-?\d+(?:\.\d+)?|null)')
                  block,n=pat.subn(lambda mm:mm.group(1)+str(want[field]),block,count=1)
                  if n!=1: raise RuntimeError(f'{field} missing for {cid}')
              out=out[:m.start()]+block+out[end:]
          p.write_text(out,encoding='utf-8')
          # Validate data payload after patch.
          a,b=out.find('['),out.rfind(']'); final=json.loads(out[a:b+1])
          fby={int(c['id']):c for c in final}
          for cid,want in fixes.items():
              c=fby[cid]
              assert c['notaJogos']==want['notaJogos'] and c['notaTrabalho']==want['notaTrabalho']

          # Shared CPU-Z renderer: reject legacy 0-10/zero values.
          p=Path('seo-tools.js'); s=p.read_text(encoding='utf-8')
          old="return Number.isFinite(n) && n > 0 ? n : null;"
          new="return Number.isFinite(n) && n >= 100 ? n : null;"
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise RuntimeError('seo-tools CPU-Z guard pattern not found')
          p.write_text(s,encoding='utf-8')

          # Standalone comparator guard.
          p=Path('comparar.html'); s=p.read_text(encoding='utf-8')
          old="const n=Number.parseInt(v,10);return Number.isFinite(n)?n.toLocaleString('pt-BR')+' pts':'N/A';"
          new="const n=Number.parseInt(v,10);return Number.isFinite(n)&&n>=100?n.toLocaleString('pt-BR')+' pts':'N/A';"
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise RuntimeError('comparar CPU-Z guard pattern not found')
          p.write_text(s,encoding='utf-8')

          # Legacy details renderer and inline comparator use the same guard.
          p=Path('detalhes.html'); s=p.read_text(encoding='utf-8')
          old="""            let ptsSingle = parseInt(cpu.notaJogos || 0);\n            let ptsMulti = parseInt(cpu.notaTrabalho || 0);"""
          new="""            const scoreCpuZ = (valor) => { const n = Number(valor); return Number.isFinite(n) && n >= 100 ? Math.round(n) : 0; };\n            let ptsSingle = scoreCpuZ(cpu.notaJogos);\n            let ptsMulti = scoreCpuZ(cpu.notaTrabalho);"""
          if old in s:s=s.replace(old,new,1)
          elif 'const scoreCpuZ = (valor)' not in s:raise RuntimeError('details primary CPU-Z pattern not found')
          replacements={
            "let cpuPtsSingle = parseInt(cpu.notaJogos || 0);":"let cpuPtsSingle = scoreCpuZ(cpu.notaJogos);",
            "let outroPtsSingle = parseInt(outro.notaJogos || 0);":"let outroPtsSingle = scoreCpuZ(outro.notaJogos);",
            "let cpuPtsMulti = parseInt(cpu.notaTrabalho || 0);":"let cpuPtsMulti = scoreCpuZ(cpu.notaTrabalho);",
            "let outroPtsMulti = parseInt(outro.notaTrabalho || 0);":"let outroPtsMulti = scoreCpuZ(outro.notaTrabalho);",
          }
          for old,new in replacements.items():
              if old in s:s=s.replace(old,new,1)
              elif new not in s:raise RuntimeError(f'details comparison pattern missing: {old}')
          p.write_text(s,encoding='utf-8')

          print('Fixed:')
          for cid,w in fixes.items():print(cid,w)
          PY
      - name: Commit targeted corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados.js seo-tools.js comparar.html detalhes.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix legacy CPU-Z score scale without touching manual scores"
          git pull --rebase origin main
          git push origin main
