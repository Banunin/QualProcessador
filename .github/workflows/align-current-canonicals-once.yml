name: Align current canonical host
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/align-current-canonicals-once.yml'
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace premature custom-domain URLs in HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old = 'https://qualprocessador.com'
          new = 'https://qualprocessador.vercel.app'
          changed = []
          for p in Path('.').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  continue
              p.write_text(s.replace(old, new), encoding='utf-8')
              changed.append(str(p))
          print('Arquivos alinhados:', ', '.join(changed) if changed else 'nenhum')
          PY
      - name: Commit canonical alignment
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Align canonical URLs with current Vercel domain"
          git push
