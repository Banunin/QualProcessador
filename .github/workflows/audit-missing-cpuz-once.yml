name: Audit missing CPU-Z scores once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-missing-cpuz-once.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print missing CPU-Z fields
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          t=Path('dados.js').read_text(encoding='utf-8'); a,b=t.find('['),t.rfind(']'); cpus=json.loads(t[a:b+1])
          def miss(v): return v is None or str(v).strip()=='' or str(v).strip().upper()=='N/A'
          for c in cpus:
              if miss(c.get('notaJogos')) or miss(c.get('notaTrabalho')):
                  print(f"{c['nome']} | threads={c.get('threads')} | single={c.get('notaJogos')} | multi={c.get('notaTrabalho')}")
          print('SINGLE_LEFT',sum(miss(c.get('notaJogos')) for c in cpus))
          print('MULTI_LEFT',sum(miss(c.get('notaTrabalho')) for c in cpus))
          PY
