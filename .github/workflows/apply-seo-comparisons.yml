name: Apply SEO comparison system
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-seo-comparisons.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch existing pages without removing features
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if new in s:
                  print(f'{label}: already applied')
                  return
              if old not in s:
                  raise SystemExit(f'{label}: expected block not found')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print(f'{label}: applied')

          replace_once(
              'index.html',
              '<script src="dados.js"></script>',
              '<script src="dados.js"></script>\n    <script src="seo-tools.js"></script>',
              'index seo tools'
          )
          replace_once(
              'index.html',
              '<a id="aba-cpus" class="nav-link">CPUs</a>\n            <a href="analises.html" class="nav-link">Artigos</a>',
              '<a id="aba-cpus" class="nav-link">CPUs</a>\n            <a href="/comparar" class="nav-link">Comparar</a>\n            <a href="analises.html" class="nav-link">Artigos</a>',
              'index compare nav'
          )
          replace_once(
              'index.html',
              '</body>',
              '    <script src="search-enhancer.js"></script>\n</body>',
              'index advanced search'
          )

          replace_once(
              'detalhes.html',
              '<script src="dados.js"></script>',
              '<script src="dados.js"></script>\n    <script src="seo-tools.js"></script>',
              'details seo tools'
          )
          replace_once(
              'detalhes.html',
              """        const idCpu = parseInt(parametrosUrl.get('id')) || 0; \n        const cpu = listaDeCpus ? listaDeCpus.find(item => item.id === idCpu) : null;\n        const container = document.getElementById('conteudo-dinamico');""",
              """        const idParam = parametrosUrl.get('id');\n        let idCpu = idParam !== null && idParam !== '' ? parseInt(idParam, 10) : NaN;\n        let cpu = Number.isFinite(idCpu) && listaDeCpus ? listaDeCpus.find(item => item.id === idCpu) : null;\n        if (!cpu && marca && cpuSlug && window.QPSeo) {\n            cpu = QPSeo.resolverSlug(cpuSlug, listaDeCpus, marca);\n        }\n        if (cpu) idCpu = cpu.id;\n        const container = document.getElementById('conteudo-dinamico');""",
              'details clean slug resolution'
          )
          replace_once(
              'detalhes.html',
              '</body>',
              '    <script src="details-seo-enhancer.js"></script>\n</body>',
              'details related comparisons'
          )

          replace_once(
              'ler-artigo.html',
              '</body>',
              '    <script src="dados.js"></script>\n    <script src="seo-tools.js"></script>\n    <script src="article-cpu-links.js"></script>\n</body>',
              'article cpu links'
          )
          PY
      - name: Commit integrated SEO changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html detalhes.html ler-artigo.html
          git commit -m "Integrate fuzzy search, comparison URLs and article CPU links"
          git push
