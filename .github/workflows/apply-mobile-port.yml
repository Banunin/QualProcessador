name: Apply mobile port

on:
  push:
    branches:
      - mobile-port
    paths:
      - 'mobile-port.css'
      - 'scripts/apply_mobile_port.py'
      - '.github/workflows/apply-mobile-port.yml'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'mobile-port' || github.ref == 'refs/heads/mobile-port'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: mobile-port

      - name: Apply responsive stylesheet links
        run: python scripts/apply_mobile_port.py

      - name: Commit generated HTML updates
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html detalhes.html analises.html ler-artigo.html forum.html
          git commit -m "Apply responsive mobile layer to legacy pages"
          git push origin mobile-port
