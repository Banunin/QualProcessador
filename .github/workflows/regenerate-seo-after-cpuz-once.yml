name: Regenerate SEO after CPU-Z once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/regenerate-seo-after-cpuz-once.yml'
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate sitemap
        run: python3 gerar_sitemap_seo.py
      - name: Commit sitemap if changed
        run: |
          if git diff --quiet sitemap.xml; then
            echo "Sitemap already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Refresh SEO sitemap after CPU-Z update"
          git pull --rebase origin main
          git push origin main
