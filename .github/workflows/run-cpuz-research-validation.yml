name: Validate CPU Monkey CPU-Z research parser

on:
  push:
    branches:
      - benchmark/fill-missing-cpuz-2026-09-07
    paths:
      - '.github/workflows/run-cpuz-research-validation.yml'

permissions:
  contents: write

jobs:
  validate-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: benchmark/fill-missing-cpuz-2026-09-07
      - name: Research first 8 missing CPUs
        env:
          CPU_MONKEY_LIMIT: '8'
        run: python3 scripts/research_cpu_monkey_cpuz.py
      - name: Apply only verified values
        run: python3 scripts/apply_cpu_benchmark_updates.py
      - name: Validate outputs
        run: |
          python3 -m json.tool dados.json >/dev/null
          python3 -m json.tool data/cpuz-benchmark-updates.json >/dev/null
          git diff --check
      - name: Commit validation batch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados.json data/cpuz-benchmark-updates.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore(data): validate CPU Monkey benchmark research"
          git push origin benchmark/fill-missing-cpuz-2026-09-07
