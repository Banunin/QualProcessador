name: Fill verified CPU-Z scores once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fill-cpuz-scores-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fill only exact published CPU-Z Benchmark 17 scores
        run: |
          python3 - <<'PY'
          import json, re, time, urllib.error, urllib.request
          from html.parser import HTMLParser
          from pathlib import Path

          PATH = Path('dados.js')
          raw_file = PATH.read_text(encoding='utf-8')
          arr_start, arr_end = raw_file.find('['), raw_file.rfind(']')
          cpus = json.loads(raw_file[arr_start:arr_end+1])

          class TextParser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.parts=[]
              def handle_data(self, data):
                  text=' '.join(data.split())
                  if text: self.parts.append(text)

          def slug(name):
              return re.sub(r'[^a-z0-9]+', '_', name.lower()).strip('_')

          def score_url(name, kind):
              suffix='single_core' if kind=='SC' else 'multi_core'
              return f'https://www.cpu-monkey.com/en/benchmark-{slug(name)}-cpu_z_benchmark_17_{suffix}'

          def fetch_html(url):
              for attempt in range(3):
                  req=urllib.request.Request(url,headers={
                      'User-Agent':'Mozilla/5.0 (compatible; QualProcessador CPU-Z benchmark verifier; +https://qualprocessador.vercel.app)'
                  })
                  try:
                      with urllib.request.urlopen(req,timeout=20) as r:
                          return r.read().decode('utf-8','ignore')
                  except urllib.error.HTTPError as e:
                      if e.code in (404,410): return None
                      if e.code in (429,500,502,503,504) and attempt<2:
                          time.sleep(2.0*(attempt+1)); continue
                      return None
                  except Exception:
                      if attempt<2:
                          time.sleep(1.5*(attempt+1)); continue
                      return None
              return None

          def fetch_score(name, kind):
              url=score_url(name,kind)
              html=fetch_html(url)
              if not html: return None,url,'page unavailable'
              p=TextParser(); p.feed(html); parts=p.parts
              benchmark_name='Single-Core' if kind=='SC' else 'Multi-Core'
              heading=f'CPU-Z Benchmark 17 {benchmark_name} - Benchmark results'
              try:
                  start=next(i for i,x in enumerate(parts) if heading in x)
              except StopIteration:
                  return None,url,'benchmark section unavailable'
              stop=min(len(parts),start+160)
              for i in range(start+1,stop):
                  if parts[i].strip().casefold()==name.strip().casefold():
                      for x in parts[i+1:min(stop,i+10)]:
                          compact=x.replace(',','').strip()
                          if re.fullmatch(r'\d+',compact):
                              value=int(compact)
                              if value>0: return value,url,'verified'
                              return None,url,'zero/unavailable'
              return None,url,'exact CPU row unavailable'

          def object_span(text, cpu_name):
              needle='"nome": '+json.dumps(cpu_name,ensure_ascii=False)
              pos=text.find(needle)
              if pos<0: return None
              start=text.rfind('\n    {',0,pos)
              if start<0: start=text.rfind('{',0,pos)
              end=text.find('\n    },',pos)
              if end<0:
                  end=text.find('\n    }',pos)
                  if end<0: return None
                  end += len('\n    }')
              else:
                  end += len('\n    }')
              return start,end

          original=raw_file
          updated=0
          filled_sc=0
          filled_mc=0
          unavailable_sc=0
          unavailable_mc=0
          sources=[]

          for index,cpu in enumerate(cpus,1):
              name=cpu.get('nome')
              if not name: continue
              needs_sc=cpu.get('notaJogos') in (None,'','N/A')
              needs_mc=cpu.get('notaTrabalho') in (None,'','N/A')
              if not (needs_sc or needs_mc): continue

              results={}
              if needs_sc:
                  results['SC']=fetch_score(name,'SC'); time.sleep(.12)
              if needs_mc:
                  results['MC']=fetch_score(name,'MC'); time.sleep(.12)

              span=object_span(raw_file,name)
              if not span:
                  print('SKIP object not found:',name); continue
              start,end=span
              block=raw_file[start:end]
              changed=False

              if needs_sc:
                  val,url,reason=results['SC']
                  if val:
                      new_block,n=re.subn(r'("notaJogos"\s*:\s*)"N/A"',lambda m:m.group(1)+str(val),block,count=1)
                      if n:
                          block=new_block; changed=True; updated+=1; filled_sc+=1; sources.append((name,'SC',val,url))
                          print(f'VERIFIED SC | {name} | {val} | {url}')
                  else:
                      unavailable_sc+=1; print(f'KEEP N/A SC | {name} | {reason}')

              if needs_mc:
                  val,url,reason=results['MC']
                  if val:
                      new_block,n=re.subn(r'("notaTrabalho"\s*:\s*)"N/A"',lambda m:m.group(1)+str(val),block,count=1)
                      if n:
                          block=new_block; changed=True; updated+=1; filled_mc+=1; sources.append((name,'MC',val,url))
                          print(f'VERIFIED MC | {name} | {val} | {url}')
                  else:
                      unavailable_mc+=1; print(f'KEEP N/A MC | {name} | {reason}')

              if changed:
                  raw_file=raw_file[:start]+block+raw_file[end:]

          if raw_file!=original:
              PATH.write_text(raw_file,encoding='utf-8')

          print('--- SUMMARY ---')
          print('CPUS_TOTAL=',len(cpus))
          print('FIELDS_UPDATED=',updated)
          print('SINGLE_FILLED=',filled_sc)
          print('MULTI_FILLED=',filled_mc)
          print('SINGLE_LEFT_UNAVAILABLE=',unavailable_sc)
          print('MULTI_LEFT_UNAVAILABLE=',unavailable_mc)
          print('SOURCE=CPU-Monkey CPU-Z Benchmark 17 exact per-model pages; no estimates; zero/missing left as N/A')
          PY
      - name: Validate dados.js and show remaining gaps
        run: |
          node --check dados.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          t=Path('dados.js').read_text(encoding='utf-8'); a,b=t.find('['),t.rfind(']'); cpus=json.loads(t[a:b+1])
          both=sum(1 for c in cpus if c.get('notaJogos') not in (None,'','N/A') and c.get('notaTrabalho') not in (None,'','N/A'))
          any_missing=sum(1 for c in cpus if c.get('notaJogos') in (None,'','N/A') or c.get('notaTrabalho') in (None,'','N/A'))
          sc_missing=sum(1 for c in cpus if c.get('notaJogos') in (None,'','N/A'))
          mc_missing=sum(1 for c in cpus if c.get('notaTrabalho') in (None,'','N/A'))
          print(f'COMPLETE_BOTH={both} ANY_MISSING={any_missing} SC_MISSING={sc_missing} MC_MISSING={mc_missing}')
          PY
      - name: Commit verified scores
        run: |
          if git diff --quiet dados.js; then
            echo "No verified missing scores were found"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados.js
          git commit -m "Fill verified CPU-Z Benchmark 17 scores"
          git push
