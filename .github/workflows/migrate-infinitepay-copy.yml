name: Update Apoiar for InfinitePay
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-infinitepay-copy.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace payment copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apoiar.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
            '<strong>Checkout seguro Mercado Pago</strong><span>Pix, cartão e outros meios disponíveis aparecem no ambiente protegido do Mercado Pago.</span>': '<strong>Checkout seguro InfinitePay</strong><span>Pix e cartão ficam disponíveis no ambiente protegido da InfinitePay.</span>',
            'Nenhuma chave privada e nenhum dado de cartão ficam nesta página. A cobrança é criada no servidor e o pagamento é concluído no checkout hospedado do Mercado Pago.': 'Nenhum dado de cartão fica nesta página. A cobrança é criada com valor protegido no servidor e o pagamento é concluído no checkout hospedado da InfinitePay.',
            "statusEl.textContent='Pagamento ainda não configurado ou indisponível. Verifique a integração do Mercado Pago.';": "statusEl.textContent='Pagamento ainda não configurado ou indisponível. Verifique sua InfiniteTag da InfinitePay.';",
            '<a href="Upscendra.html">Upscendra</a>': '<a href="upscendra.html">Upscendra</a>',
            '<a href="WinFormatKit.html">WinFormatKit</a>': '<a href="winformatkit.html">WinFormatKit</a>',
            "const paymentResult=query.get('payment');\nif(paymentResult){\n  const map={approved:'Pagamento aprovado. Obrigado!',pending:'Pagamento pendente. Assim que for confirmado você receberá a confirmação do provedor.',failure:'O pagamento não foi concluído.'};\n  paymentStatus.className='status-msg show '+(paymentResult==='approved'?'ok':'warn');\n  paymentStatus.textContent=map[paymentResult]||'Status de pagamento recebido.';\n}": "const transactionNsu=query.get('transaction_nsu');\nconst receiptUrl=query.get('receipt_url');\nif(transactionNsu){\n  paymentStatus.className='status-msg show ok';\n  paymentStatus.innerHTML='Pagamento finalizado pela InfinitePay.' + (receiptUrl ? ' <a href=\"'+receiptUrl.replace(/\"/g,'')+'\" target=\"_blank\" rel=\"noopener\">Ver comprovante</a>' : '');\n}"
          }
          for old, new in replacements.items():
              if old not in s:
                  print('Aviso: trecho não encontrado:', old[:80])
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apoiar.html
          git commit -m "Adapt Apoiar page to InfinitePay"
          git push
