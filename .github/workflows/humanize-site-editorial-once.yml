name: Humanize site editorial once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/humanize-site-editorial-once.yml'
permissions:
  contents: write
jobs:
  humanize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply site-wide editorial cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          changed = []
          def load(path):
              return Path(path).read_text(encoding='utf-8')
          def save(path, text, old):
              if text != old:
                  Path(path).write_text(text, encoding='utf-8')
                  changed.append(path)
          def rep(text, old, new, required=False, label=''):
              if old not in text:
                  if required:
                      raise RuntimeError('Trecho obrigatório não encontrado: ' + (label or old[:100]))
                  return text
              return text.replace(old, new)

          dados_hash_before = hashlib.sha256(Path('dados.js').read_bytes()).hexdigest()

          # HOME — simples na entrada, técnica quando o usuário aprofunda.
          path='index.html'; old=load(path); s=old
          s=rep(s,'<title>QualProcessador | Compare Processadores AMD e Intel para Jogos e Trabalho</title>',
                '<title>QualProcessador | Fichas técnicas, CPU-Z e comparação de processadores</title>',True,'title home')
          s=rep(s,'<meta name="description" content="Compare especificações técnicas detalhadas, analise benchmarks de hardware em jogos ou produtividade e tire dúvidas na nossa comunidade. Descubra qual processador comprar para o seu setup.">',
                '<meta name="description" content="Compare processadores AMD e Intel com fichas técnicas, resultados CPU-Z, núcleos, threads, clocks, soquete, TDP e comparação lado a lado.">',True,'description home')
          s=rep(s,'<p>Compare fichas técnicas completas, analise o desempenho em jogos ou trabalho e monte o setup ideal com as últimas novidades de hardware AMD Ryzen e Intel Core.</p>',
                '<p>Fichas técnicas, resultados CPU-Z e comparações de processadores AMD e Intel. Veja o essencial primeiro e abra os detalhes quando precisar.</p>',True,'hero home')
          s=rep(s,'placeholder="Pesquise por uma ficha de CPU... (Ex: Ryzen 5 5600)"','placeholder="Digite um processador (ex.: Ryzen 5 5600)"')
          s=s.replace('Artigos em Destaque','Artigos em destaque')
          s=s.replace('Últimos Processadores e Fichas Técnicas Catalogadas','Processadores adicionados recentemente')
          s=s.replace('Catálogo Completo de Processadores Intel e AMD','Todos os processadores')
          s=s.replace('Vídeo Integrado','Vídeo integrado')
          s=s.replace('Classificação de Desempenho','Classificação')
          s=s.replace('Ver Mais CPUs','Ver mais CPUs')
          s=s.replace('<span>Cores/Threads</span>','<span>Núcleos/Threads</span>')
          s=s.replace('<span>Boost Clock</span>','<span>Boost</span>')
          s=s.replace('>Visualizar Ficha Completa<','>Abrir ficha técnica<')
          save(path,s,old)

          # CAMADA EDITORIAL DAS FICHAS — texto factual; nada de adjetivo automático.
          path='seo-tools.js'; old=load(path); s=old
          s=s.replace("return 'Não possui vídeo integrado; para saída de imagem e aceleração 3D é necessária uma placa de vídeo dedicada.';",
                      "return 'Não possui vídeo integrado. O computador precisa de uma placa de vídeo dedicada para exibir imagem.';")
          s=s.replace("let plataformaTexto = plataforma.length ? `A ficha registra ${plataforma.join(', ')}. ` : '';",
                      "let plataformaTexto = plataforma.length ? `Especificações de plataforma: ${plataforma.join(', ')}. ` : '';")
          s=s.replace("paragrafos.push(`Nos resultados CPU-Z cadastrados no QualProcessador, o ${nome} registra ${partes.join(' e ')}.`);",
                      "paragrafos.push(`No CPU-Z, o ${nome} registra ${partes.join(' e ')}.`);")
          s=s.replace("const meta = `${nome}: ficha técnica${metaPartes.length ? ' com ' + metaPartes.join(', ') : ''}, resultados CPU-Z e comparações de processadores.`;",
                      "const meta = `${nome}: ficha técnica${metaPartes.length ? ' com ' + metaPartes.join(', ') : ''}, resultados CPU-Z e comparação com outros processadores.`;")
          save(path,s,old)

          # ENHANCER — explica benchmark sem confundir CPU-Z com FPS.
          path='details-seo-enhancer.js'; old=load(path); s=old
          s=s.replace("nota.textContent = 'Os resultados acima são do CPU-Z. Eles ajudam a comparar processadores, mas não equivalem diretamente a FPS em jogos ou ao tempo de execução de um programa específico.';",
                      "nota.textContent = 'CPU-Z é um benchmark sintético. Os pontos ajudam a comparar processadores, mas não representam diretamente FPS ou o desempenho de um programa específico.';")
          s=s.replace("p.textContent = 'Modelos próximos em geração, plataforma ou desempenho para continuar a comparação.';",
                      "p.textContent = 'Modelos próximos em geração, plataforma ou desempenho.';")
          save(path,s,old)

          # FICHA TÉCNICA — fallback legível mesmo se o enhancer não carregar.
          path='detalhes.html'; old=load(path); s=old
          s=s.replace('<span>Cores</span>','<span>Núcleos</span>')
          s=s.replace('<span>Base Clock</span>','<span>Clock base</span>')
          s=s.replace('<span>Boost Clock</span>','<span>Boost</span>')
          s=s.replace('Ficha Técnica</button>','Ficha técnica</button>')
          s=s.replace('Histórico de Preços</button>','Histórico de preços</button>')
          s=s.replace('Comparar Modelo</button>','Comparar</button>')
          old_geral='''                                <h2>Geral</h2>\n                                <p>${cpu.analise}</p>\n                                <p>Operando com consumo de <strong>${cpu.tdp}</strong> e alcançando até <strong>${cpu.freqBoost}</strong>, este é um componente notável. Vale ressaltar que o processador <strong>${cpu.video === 'Não possui' ? 'exigirá uma placa de vídeo dedicada' : 'já possui gráfico integrado'}</strong>.</p>'''
          new_geral='''                                <h2>Visão geral</h2>\n                                <p><strong>${cpu.nome}</strong>: ${cpu.cores} núcleos, ${cpu.threads} threads, clock base de ${cpu.freqBase} e boost de até ${cpu.freqBoost}.</p>\n                                <p>TDP de <strong>${cpu.tdp}</strong>. ${cpu.video === 'Não possui' ? 'Não possui vídeo integrado e precisa de placa de vídeo dedicada para exibir imagem.' : `Possui vídeo integrado: <strong>${cpu.video}</strong>.`}</p>'''
          s=rep(s,old_geral,new_geral,True,'visão geral detalhes')
          s=s.replace('Desempenho Single-Core','CPU-Z Single Thread')
          s=s.replace('Mede a força de um único núcleo. É o fator crucial para empurrar as taxas de quadro (FPS) em jogos de PC. Dados: CPU-Z - CPU-monkey.',
                      'Pontuação do CPU-Z usando uma thread. É um benchmark sintético e não corresponde diretamente a FPS em jogos.')
          s=s.replace('Desempenho Multi-Core','CPU-Z Multi Thread')
          s=s.replace('Mede a potência de todos os núcleos trabalhando juntos. Vital para streaming, render de vídeos e tarefas pesadas em lote. Dados: CPU-Z - CPU-monkey',
                      'Pontuação do CPU-Z usando várias threads. O resultado varia com núcleos, threads, clocks e plataforma.')
          s=s.replace("<strong>${ptsSingle.toLocaleString('pt-BR')} pts</strong>","<strong>${ptsSingle ? ptsSingle.toLocaleString('pt-BR') + ' pts' : 'N/A'}</strong>")
          s=s.replace("<strong>${ptsMulti.toLocaleString('pt-BR')} pts</strong>","<strong>${ptsMulti ? ptsMulti.toLocaleString('pt-BR') + ' pts' : 'N/A'}</strong>")
          s=s.replace('(ptsSingle / 3500)','(ptsSingle / 1000)')
          s=s.replace('(ptsMulti / 45000)','(ptsMulti / 20000)')
          # Não inventar especificações ausentes: profissional prefere N/A a um chute elegante.
          replacements={
            "${cpu.segmento || 'Desktop'}":"${cpu.segmento || '—'}",
            "${cpu.mercado || 'Consumidor'}":"${cpu.mercado || '—'}",
            "${cpu.desbloqueado || 'Sim'}":"${cpu.desbloqueado || '—'}",
            "${cpu.overclock || 'Suportado'}":"${cpu.overclock || '—'}",
            "${cpu.tipoFixacao || (cpu.marca === 'amd' ? 'PGA / LGA' : 'LGA')}":"${cpu.tipoFixacao || '—'}",
            "${cpu.pcie || ''}":"${cpu.pcie || '—'}",
            "${cpu.memoria}":"${cpu.memoria || '—'}",
            "${cpu.canaisMemoria || 'Dual Channel'}":"${cpu.canaisMemoria || '—'}",
            "${cpu.memoriaMaxima || '128 GB'}":"${cpu.memoriaMaxima || '—'}",
            "${cpu.ecc || 'Não'}":"${cpu.ecc || cpu.suporteEcc || '—'}",
            "${cpu.gpuIntegrada || (cpu.video === 'Não possui' ? '—' : 'Possui')}":"${cpu.gpuIntegrada || '—'}",
            "${cpu.igpuFreq || ''}":"${cpu.igpuFreq || '—'}",
            "${cpu.coolerIncluso || 'Depende do lote / modelo'}":"${cpu.coolerIncluso || '—'}",
            "${cpu.virtualizacao || (cpu.marca === 'amd' ? 'AMD-V / SVM' : 'Intel VT-x')}":"${cpu.virtualizacao || '—'}",
            "${cpu.instrucoes || 'AES, AVX, AVX2, FMA3'}":"${cpu.instrucoes || '—'}"
          }
          for a,b in replacements.items(): s=s.replace(a,b)
          s=s.replace('<h2>Histórico de Preços</h2>','<h2>Histórico de preços</h2>')
          s=s.replace('Esta funcionalidade está sendo estruturada. Em breve, você poderá acompanhar gráficos com a variação de valores deste processador nos principais varejistas do mercado.','O histórico de preços ainda não está disponível para este modelo.')
          s=s.replace('<h2>Comparar Modelo</h2>','<h2>Comparar</h2>')
          s=s.replace('Comentários e Discussões','Comentários')
          s=s.replace('Faça login para participar da discussão e deixar sua opinião.','Entre na sua conta para comentar ou responder.')
          s=s.replace('Entrar / Criar Conta','Entrar / Criar conta')
          s=s.replace('Entrar / Cadastrar','Entrar / Criar conta')
          s=s.replace('Escreva sua opinião técnica ou dúvida sobre este processador...','Escreva sua dúvida, experiência ou correção sobre este processador.')
          s=s.replace('Publicar Comentário','Publicar comentário')
          s=s.replace('Nenhum comentário registrado ainda. Seja o primeiro a comentar!','Ainda não há comentários.')
          save(path,s,old)

          # COMPARADOR — dados primeiro, conclusão curta e benchmark com nome correto.
          path='comparar.html'; old=load(path); s=old
          s=s.replace('content="Compare processadores AMD e Intel lado a lado: núcleos, threads, clocks, TDP, plataforma e benchmarks Single-Core e Multi-Core."',
                      'content="Compare processadores AMD e Intel lado a lado: núcleos, threads, clocks, TDP, plataforma e resultados CPU-Z Single Thread e Multi Thread."')
          s=s.replace('content="Compare fichas técnicas e benchmarks de processadores AMD e Intel lado a lado."',
                      'content="Compare fichas técnicas e resultados CPU-Z de processadores AMD e Intel lado a lado."')
          s=s.replace('Escolha dois processadores para comparar ficha técnica, plataforma e as pontuações Single-Core e Multi-Core cadastradas no QualProcessador.',
                      'Escolha dois processadores. A página mostra especificações, plataforma e resultados CPU-Z lado a lado.')
          s=s.replace('Outras comparações relacionadas','Comparações relacionadas')
          s=s.replace('Cada comparação recebe uma URL própria no formato <code>/comparar/processador-a-vs-processador-b</code>, facilitando compartilhar, voltar à análise e permitir que mecanismos de busca descubram comparações relevantes.',
                      'A comparação pode ser compartilhada por link e mantém acesso às fichas técnicas individuais.')
          s=s.replace('description:`Compare ${a.nome} e ${b.nome}: especificações, plataforma e benchmarks Single-Core e Multi-Core.`',
                      'description:`Compare ${a.nome} e ${b.nome}: especificações, plataforma e resultados CPU-Z Single Thread e Multi Thread.`')
          s=s.replace("$('hero-desc').textContent='Comparação direta de especificações, plataforma e benchmarks cadastrados no QualProcessador.';",
                      "$('hero-desc').textContent='Especificações e resultados CPU-Z lado a lado.';")
          s=s.replace("$('comparison-lead').textContent=`Veja lado a lado os dados técnicos de ${a.nome} e ${b.nome}, usando as informações já cadastradas nas fichas do QualProcessador.`;",
                      "$('comparison-lead').textContent=`Compare os dados técnicos de ${a.nome} e ${b.nome}.`;")
          s=s.replace("scoreCard('Single-Core (Jogos)',a,b,'notaJogos')+scoreCard('Multi-Core (Trabalho)',a,b,'notaTrabalho')",
                      "scoreCard('CPU-Z Single Thread',a,b,'notaJogos')+scoreCard('CPU-Z Multi Thread',a,b,'notaTrabalho')")
          old_summary="$('summary-card').innerHTML=`<h2>Resumo da comparação</h2><p><strong>${esc(a.nome)}</strong> possui ${esc(valor(a.cores))} núcleos e ${esc(valor(a.threads))} threads, enquanto o <strong>${esc(b.nome)}</strong> possui ${esc(valor(b.cores))} núcleos e ${esc(valor(b.threads))} threads.</p><p>No banco do QualProcessador, as pontuações cadastradas são <strong>${esc(pontos(a.notaJogos))}</strong> contra <strong>${esc(pontos(b.notaJogos))}</strong> em Single-Core e <strong>${esc(pontos(a.notaTrabalho))}</strong> contra <strong>${esc(pontos(b.notaTrabalho))}</strong> em Multi-Core. Consulte as fichas individuais para contexto técnico completo.</p>`;"
          new_summary="$('summary-card').innerHTML=`<h2>Resumo</h2><p><strong>${esc(a.nome)}</strong> tem ${esc(valor(a.cores))} núcleos e ${esc(valor(a.threads))} threads; <strong>${esc(b.nome)}</strong> tem ${esc(valor(b.cores))} núcleos e ${esc(valor(b.threads))} threads.</p><p>No CPU-Z: <strong>${esc(pontos(a.notaJogos))}</strong> contra <strong>${esc(pontos(b.notaJogos))}</strong> em Single Thread e <strong>${esc(pontos(a.notaTrabalho))}</strong> contra <strong>${esc(pontos(b.notaTrabalho))}</strong> em Multi Thread. São resultados sintéticos e não representam FPS diretamente.</p>`;"
          s=rep(s,old_summary,new_summary,True,'resumo comparador')
          save(path,s,old)

          # ARTIGOS — navegação simples; conteúdo autoral é preservado.
          path='analises.html'; old=load(path); s=old
          s=s.replace('Guias, testes e reviews produzidos pelo QualProcessador.','Guias, testes e artigos sobre hardware, do básico aos detalhes técnicos.')
          save(path,s,old)

          path='ler-artigo.html'; old=load(path); s=old
          s=s.replace('Entrar / Cadastrar','Entrar / Criar conta')
          s=s.replace('<h2>Artigo Não Encontrado</h2>','<h2>Artigo não encontrado</h2>')
          s=s.replace('O artigo solicitado não foi encontrado no banco de dados.','Não encontramos este artigo.')
          s=s.replace('Voltar ao Hub de Análises','Voltar aos artigos')
          s=s.replace('Publicado por <strong>${escapeHTML(artigo.autor)}</strong> • ⏱️ Leitura: ${escapeHTML(artigo.tempoLeitura)} • 💬 <a href="#secao-comentarios" class="link-comentarios-topo"><span id="topo-contador-comentarios">0</span> Comentários</a>',
                      'Por <strong>${escapeHTML(artigo.autor)}</strong> • Leitura: ${escapeHTML(artigo.tempoLeitura)} • <a href="#secao-comentarios" class="link-comentarios-topo"><span id="topo-contador-comentarios">0</span> comentários</a>')
          s=s.replace('Nenhum comentário registrado ainda. Seja o primeiro a comentar!','Ainda não há comentários.')
          s=s.replace('Enviar Resposta','Enviar resposta')
          s=s.replace('Salvar Edição','Salvar edição')
          save(path,s,old)

          # APOIO — transparente, sem linguagem de venda genérica.
          path='apoiar.html'; old=load(path); s=old
          s=s.replace('<h1>Ajude a manter o projeto evoluindo.</h1>','<h1>Ajude a manter o projeto.</h1>')
          s=s.replace('O QualProcessador, o Upscendra e o WinFormatKit são desenvolvidos de forma independente. Se alguma dessas ferramentas economizou seu tempo, você pode contribuir com qualquer valor e ajudar a financiar desenvolvimento, testes e infraestrutura.',
                      'O QualProcessador, o Upscendra e o WinFormatKit são projetos independentes. As contribuições ajudam a pagar infraestrutura, testes e tempo de desenvolvimento.')
          s=s.replace('Escolha a versão que combina com seu uso','WinFormatKit Plus e Pro')
          s=s.replace('A versão gratuita continua útil. Plus e Pro ampliam conversões, idiomas, temas e recursos para quem usa o programa com mais frequência.',
                      'A versão gratuita continua disponível. Plus e Pro acrescentam formatos, idiomas, temas e ferramentas.')
          s=s.replace('Quase toda a experiência avançada do Pro, por um valor mais acessível.','Mais formatos, idiomas, temas e ferramentas do que a versão gratuita.')
          s=s.replace('A edição mais completa, com o maior conjunto de conversões, personalização e recursos avançados.','Inclui tudo do Plus e amplia o catálogo de formatos, temas, idiomas e ferramentas.')
          s=s.replace('Não quer contribuir agora? Você também pode enviar uma mensagem, sugestão ou relato sobre alguma das ferramentas.','Para enviar uma dúvida, sugestão ou relato sobre as ferramentas, use o formulário.')
          s=s.replace("status.textContent='Mensagem enviada. Obrigado pelo contato.';","status.textContent='Mensagem enviada.';")
          save(path,s,old)

          # FERRAMENTAS — já estava direta; só retirar expressão desnecessariamente promocional.
          path='ferramentas.html'; old=load(path); s=old
          s=s.replace('Edite, redimensione e aumente a resolução de imagens em 2x ou 4x com AI Upscale.','Edite, redimensione e aumente a resolução de imagens em 2x ou 4x.')
          save(path,s,old)

          path='upscendra.html'; old=load(path); s=old
          s=s.replace('<h2>Para quem precisa melhorar imagens sem usar um editor online</h2>','<h2>Quando o Upscendra é útil</h2>')
          s=s.replace('<h4>Processe</h4><p>O trabalho acontece no Windows.</p>','<h4>Processe</h4><p>O processamento é local.</p>')
          save(path,s,old)

          path='winformatkit.html'; old=load(path); s=old
          s=s.replace('Comece pela versão gratuita e, se precisar de mais conversões, idiomas e personalização, escolha uma das edições avançadas.',
                      'A versão gratuita cobre as conversões principais. Plus e Pro acrescentam formatos, idiomas, temas e outras ferramentas.')
          s=s.replace('A base do WinFormatKit continua gratuita e completa para as conversões mais comuns.','A versão gratuita cobre as conversões mais comuns.')
          s=s.replace('Quase toda a experiência avançada do Pro por um valor menor.','Mais formatos, idiomas, temas e ferramentas do que a versão gratuita.')
          s=s.replace('A edição mais completa do WinFormatKit, feita para quem quer o maior catálogo possível.','Inclui tudo do Plus e amplia o catálogo de formatos, temas, idiomas e ferramentas.')
          s=s.replace('Recursos premium e novas funções avançadas','Recursos adicionais do Pro')
          save(path,s,old)

          # COMUNIDADE — já estava humana; aparar nomenclatura de seção.
          path='Comunidade.html'; old=load(path); s=old
          s=s.replace('<h2>O que você encontra por lá</h2>','<h2>O que há nos canais</h2>')
          save(path,s,old)

          # FÓRUM — primeira passada já feita; apenas uniformiza algumas frases restantes.
          path='forum.html'; old=load(path); s=old
          s=s.replace('⬅ Voltar aos Tópicos','⬅ Voltar aos tópicos')
          s=s.replace('Publicado na comunidade em','Publicado em')
          save(path,s,old)

          # GERADOR — novas CPUs nunca mais nascem com escala 0–10 nem com prosa promocional.
          path='gerar_dados.py'; old=load(path); s=old
          old_analysis='''    analise = (\n        f"O {nome_cpu} é um processador construído sobre a microarquitetura {gen_meta['arquitetura']} "\n        f"com litografia de {gen_meta['litografia']}. Equipado com {item['c']} núcleos físicos e {item['t']} threads, "\n        f"este modelo opera no soquete {gen_meta['soquete']} e destaca-se por ser {gen_meta['epoca']}."\n    )'''
          new_analysis='''    analise = (\n        f"O {nome_cpu} usa a arquitetura {gen_meta['arquitetura']} e o soquete {gen_meta['soquete']}. "\n        f"Tem {item['c']} núcleos e {item['t']} threads, clock base de {item['base']}, "\n        f"boost de até {item['boost']} e TDP de {item['tdp']}."\n    )'''
          s=rep(s,old_analysis,new_analysis,True,'analise gerador')
          old_full='''    analise_completa = f"""\n        <h2>1. Visão Geral e Arquitetura do {nome_cpu}</h2>\n        <p>O <strong>{nome_cpu}</strong> pertence à linha {familia_txt} da {marca.upper()} baseada na arquitetura <strong>{gen_meta['arquitetura']}</strong>. Projetado para o segmento de Desktops utilizando o encaixe <strong>{gen_meta['soquete']}</strong>.</p>\n        <h2>2. Desempenho e Consumo Térmico</h2>\n        <p>Conta com uma frequência base de {item['base']} atingindo picos automáticos de até <strong>{item['boost']}</strong> em tarefas exigentes. O seu perfil operacional trabalha sob o limite de TDP estruturado em <strong>{item['tdp']}</strong>.</p>\n    """'''
          new_full='''    analise_completa = f"""\n        <h2>Visão geral</h2>\n        <p>O <strong>{nome_cpu}</strong> usa a arquitetura <strong>{gen_meta['arquitetura']}</strong>, o soquete <strong>{gen_meta['soquete']}</strong> e tem {item['c']} núcleos e {item['t']} threads.</p>\n        <h2>Clocks e TDP</h2>\n        <p>O clock base é de {item['base']}, com boost de até <strong>{item['boost']}</strong>. O TDP informado é de <strong>{item['tdp']}</strong>.</p>\n    """'''
          s=rep(s,old_full,new_full,True,'analise completa gerador')
          s=s.replace('"notaJogos": 5.0,','"notaJogos": "N/A",')
          s=s.replace('"notaTrabalho": 5.0,','"notaTrabalho": "N/A",')
          s=s.replace("print(f\"✨ Sucesso Total! O seu 'dados.js' foi gerado profissionalmente. Total na base: {len(processadores_finais)} cpus.\")",
                      "print(f\"dados.js gerado. Total na base: {len(processadores_finais)} CPUs.\")")
          save(path,s,old)

          dados_hash_after = hashlib.sha256(Path('dados.js').read_bytes()).hexdigest()
          if dados_hash_before != dados_hash_after:
              raise RuntimeError('dados.js foi alterado; abortando para preservar o banco atual')

          print('Arquivos alterados:')
          for p in changed: print(' -', p)
          PY

      - name: Validate edited code and protected data
        run: |
          node --check seo-tools.js
          node --check details-seo-enhancer.js
          python3 -m py_compile gerar_dados.py
          if grep -q '"notaJogos": 5.0' gerar_dados.py || grep -q '"notaTrabalho": 5.0' gerar_dados.py; then
            echo 'Escala antiga ainda presente no gerador' >&2
            exit 1
          fi
          grep -q 'CPU-Z Single Thread' comparar.html
          grep -q 'Pergunte do jeito que souber' forum.html

      - name: Commit editorial changes
        run: |
