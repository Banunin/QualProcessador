name: Apply WinFormatKit plans

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/patch_winformatkit_plans.py'
      - '.github/workflows/patch-winformatkit-plans.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch WinFormatKit page
        run: python scripts/patch_winformatkit_plans.py
      - name: Commit page update
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WinFormatKit.html
          git commit -m "Present WinFormatKit Plus and Pro plans"
          git push origin main
