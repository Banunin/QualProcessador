name: Restore c0ef CPU score baseline once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-c0ef-scores-once.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore only notaJogos and notaTrabalho from c0ef baseline
        run: |
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path

          BASE='c0efea3d03f33e005b1baf6eb7f2a781bbdc324e'
          def parse(text):
              a,b=text.find('['),text.rfind(']')
              return json.loads(text[a:b+1])
          def num(v):
              try:return float(v)
              except:return None
          def valid(v):
              n=num(v)
              return n is not None and n >= 100
          def normalized(v):
              return v if valid(v) else 'N/A'

          p=Path('dados.js')
          current_text=p.read_text(encoding='utf-8')
          current=parse(current_text)
          base=parse(subprocess.check_output(['git','show',f'{BASE}:dados.js'],text=True,encoding='utf-8'))
          base_by={(str(c.get('id')),c.get('nome')):c for c in base}

          changes=[]
          output=current_text
          # Work by current CPU order/ID and replace only the two score literals.
          for c in current:
              cid=str(c.get('id')); name=c.get('nome')
              b=base_by.get((cid,name))
              if not b: continue
              wanted={f:normalized(b.get(f)) for f in ('notaJogos','notaTrabalho')}
              for f in ('notaJogos','notaTrabalho'):
                  if c.get(f)!=wanted[f]:
                      changes.append((cid,name,f,c.get(f),wanted[f]))
              if not any(x[0]==cid and x[1]==name for x in changes):
                  continue
              m=re.search(r'\n    \{\n        "id":\s*'+re.escape(cid)+r',',output)
              if not m: raise RuntimeError(f'CPU block not found {cid} {name}')
              nxt=re.search(r'\n    \{\n        "id":\s*\d+,',output[m.end():])
              end=m.end()+nxt.start() if nxt else output.rfind('\n];')
              block=output[m.start():end]
              for f in ('notaJogos','notaTrabalho'):
                  val=json.dumps(wanted[f],ensure_ascii=False)
                  pat=re.compile(r'("'+f+r'"\s*:\s*)("[^"]*"|-?\d+(?:\.\d+)?|null)')
                  block,n=pat.subn(lambda mm:mm.group(1)+val,block,count=1)
                  if n!=1: raise RuntimeError(f'{f} missing for {cid} {name}')
              output=output[:m.start()]+block+output[end:]

          p.write_text(output,encoding='utf-8')
          final=parse(output)
          final_by={(str(c.get('id')),c.get('nome')):c for c in final}
          mismatches=[]
          for key,b in base_by.items():
              c=final_by.get(key)
              if not c: continue
              for f in ('notaJogos','notaTrabalho'):
                  if c.get(f)!=normalized(b.get(f)):
                      mismatches.append((key,f,c.get(f),normalized(b.get(f))))
          if mismatches: raise RuntimeError('Post-restore mismatch: '+repr(mismatches[:10]))

          print('RESTORED_SCORE_FIELDS',len(changes))
          for row in changes: print('RESTORE',*row,sep=' | ')
          PY
      - name: Commit restored score layer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Restore CPU scores from c0ef verified baseline"
          git pull --rebase origin main
          git push origin main
