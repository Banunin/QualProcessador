name: Audit post-c0ef CPU scores once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-c0ef-scores-once.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find score fields added after c0ef verified snapshot
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path

          BASE='c0efea3d03f33e005b1baf6eb7f2a781bbdc324e'
          def parse(text):
              a,b=text.find('['),text.rfind(']')
              return json.loads(text[a:b+1])
          def num(v):
              try:return float(v)
              except:return None
          def valid(v):
              n=num(v)
              return n is not None and n >= 100

          current=parse(Path('dados.js').read_text(encoding='utf-8'))
          base=parse(subprocess.check_output(['git','show',f'{BASE}:dados.js'],text=True,encoding='utf-8'))
          cur_by={(str(c.get('id')),c.get('nome')):c for c in current}
          extras=[]
          for b in base:
              c=cur_by.get((str(b.get('id')),b.get('nome')))
              if not c:continue
              for f in ('notaJogos','notaTrabalho'):
                  bv,cv=b.get(f),c.get(f)
                  if not valid(bv) and valid(cv):
                      extras.append((b.get('id'),b.get('nome'),f,bv,cv))

          lines=['POST-C0EF SCORE ADDITIONS AUDIT',f'BASE={BASE}',f'EXTRA VALID SCORE FIELDS NOW={len(extras)}','']
          for r in extras:
              lines.append(f'{r[0]} | {r[1]} | {r[2]} | c0ef={r[3]} | current={r[4]}')
          lines.append('')
          lines.append('AUDIT ONLY: dados.js not modified.')
          Path('cpu-score-c0ef-audit.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('\n'.join(lines))
          PY
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cpu-score-c0ef-audit.txt
          git commit -m "Report score fields added after c0ef" || exit 0
          git pull --rebase origin main
          git push origin main
