<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/icon.ico" type="image/x-icon">
    <title>Carregando Artigo... - QualProcessador</title>
    
    <meta name="description" content="Leia nossas análises e descubra se o produto vale a pena.">
    <meta name="robots" content="index, follow">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; } /* Rolagem suave ao clicar em links âncora */
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; color: #0f172a; margin: 0; padding: 0; }
        .article-nav { background-color: #0f172a; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; }
        .article-nav a { color: #94a3b8; text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: color 0.2s; }
        .article-nav a:hover { color: #38bdf8; }
        .article-header { max-width: 850px; margin: 50px auto 30px auto; padding: 0 20px; text-align: left; }
        .meta-category { color: #ef4444; font-weight: 800; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1.5px; display: block; margin-bottom: 12px; }
        .article-title { font-size: 2.6rem; font-weight: 800; line-height: 1.25; color: #0f172a; letter-spacing: -1.5px; margin: 0 0 20px 0; }
        .article-meta-info { display: flex; align-items: center; gap: 15px; font-size: 0.88rem; color: #64748b; border-bottom: 1px solid #e2e8f0; padding-bottom: 25px; font-weight: 500; }
        .author-avatar { width: 35px; height: 35px; background-color: #cbd5e1; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #475569; font-size: 0.8rem; }
        .cover-img { width: 100%; max-height: 420px; object-fit: cover; border-radius: 12px; margin-bottom: 30px; }
        .article-container { max-width: 850px; margin: 0 auto; padding: 0 20px 80px 20px; }
        .article-body { font-family: 'Lora', serif; font-size: 1.15rem; line-height: 1.85; color: #334155; }
        .article-body h2 { font-family: 'Poppins', sans-serif; font-size: 1.6rem; font-weight: 800; color: #0f172a; margin-top: 45px; margin-bottom: 15px; }
        .article-body p { margin-bottom: 25px; }
        .article-body ul, .article-body ol { margin-bottom: 25px; padding-left: 20px; }
        .article-body li { margin-bottom: 10px; }
        .article-body a { color: #0284c7; text-decoration: underline; font-weight: 600; }
        
        .link-comentarios-topo { color: #64748b; text-decoration: none; border-bottom: 1px dashed #cbd5e1; transition: all 0.2s; cursor: pointer; }
        .link-comentarios-topo:hover { color: #0f172a; border-color: #0f172a; }

        /* COMENTÁRIOS E THREADS */
        .comments-section { max-width: 850px; margin: 0 auto 40px auto; padding: 30px 20px; border-top: 2px solid #e2e8f0; }
        .comments-section h3 { font-size: 1.5rem; font-weight: 800; color: #0f172a; margin-bottom: 20px; }
        
        .badge-contador { background-color: #e2e8f0; color: #475569; padding: 4px 12px; border-radius: 20px; font-size: 0.9rem; font-weight: 700; }
        
        .auth-box { background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 25px; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05); margin-bottom: 30px; }
        .auth-box h4 { margin-top: 0; margin-bottom: 15px; color: #0f172a; font-size: 1.1rem; }
        .form-input { width: 100%; padding: 12px 15px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: 'Poppins', sans-serif; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
        .form-input:focus { border-color: #38bdf8; }
        .btn-primary { width: 100%; background-color: #0f172a; color: white; border: none; padding: 12px; border-radius: 8px; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background-color 0.2s; }
        .btn-primary:hover { background-color: #1e293b; }
        .auth-links { display: flex; justify-content: space-between; margin-top: 15px; }
        .auth-links button { background: none; border: none; color: #64748b; font-family: 'Poppins', sans-serif; font-size: 0.85rem; font-weight: 600; cursor: pointer; padding: 0; }
        .auth-links button:hover { color: #38bdf8; text-decoration: underline; }
        
        /* ESTILO DOS COMENTÁRIOS EM THREAD */
        .comment-item { background: #ffffff; padding: 18px; border-radius: 10px; border: 1px solid #e2e8f0; margin-bottom: 15px; }
        .comment-item.reply { margin-left: 40px; border-left: 3px solid #cbd5e1; background: #f8fafc; }
        .comment-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .comment-author-info { display: flex; gap: 10px; align-items: center; }
        .comment-author { font-weight: 700; color: #1e293b; font-size: 0.95rem; }
        .comment-date { font-size: 0.75rem; color: #94a3b8; }
        .comment-body { color: #334155; line-height: 1.6; font-size: 0.95rem; margin: 8px 0; white-space: pre-wrap; }
        .comment-actions { display: flex; gap: 12px; font-size: 0.8rem; margin-top: 8px; }
        .comment-actions button { background: none; border: none; cursor: pointer; color: #64748b; font-weight: bold; font-family: 'Poppins', sans-serif; padding: 0; transition: color 0.2s; }
        .comment-actions button:hover { color: #0f172a; }
        .comment-actions button.btn-delete { color: #ef4444; }
        .no-comments { color: #64748b; text-align: center; font-style: italic; margin-top: 10px; }

        footer { text-align: center; padding: 40px; color: #64748b; border-top: 1px solid #e2e8f0; font-size: 0.85rem; font-weight: 600; background: white; }
    </style>
</head>
<body>

    <nav class="article-nav">
        <a href="analises.html">← Voltar para Artigos</a>
        <a href="index.html">Página Inicial</a>
    </nav>

    <main id="conteudo-artigo-dinamico">
        <div class="article-container" style="text-align: center; margin-top: 100px;">
            <h2>Carregando conteúdo...</h2>
        </div>
    </main>

    <section id="secao-comentarios" class="comments-section" style="display: none;">
        <h3>Deixe seu comentário</h3>
        
        <div id="auth-container" class="auth-box">
            <div id="form-registro">
                <h4>Crie sua conta para comentar</h4>
                <input type="email" id="reg-email" placeholder="E-mail" class="form-input">
                <input type="text" id="reg-username" placeholder="Nome de usuário (Como você aparecerá)" class="form-input">
                <input type="password" id="reg-senha" placeholder="Senha" class="form-input">
                <button class="btn-primary" onclick="criarContaSupabase()">Criar Minha Conta</button>
                <div class="auth-links">
                    <button type="button" onclick="alternarFormulario('login')">Já tem conta? Fazer Login</button>
                    <button type="button" onclick="alert('Instruções para redefinição de senha foram enviadas ao seu e-mail.')">Esqueci a senha</button>
                </div>
            </div>

            <div id="form-login" style="display: none;">
                <h4>Faça login para comentar</h4>
                <input type="email" id="log-email" placeholder="Seu E-mail" class="form-input">
                <input type="password" id="log-senha" placeholder="Senha" class="form-input">
                <button class="btn-primary" onclick="logarSupabase()">Entrar na Conta</button>
                <div class="auth-links">
                    <button type="button" onclick="alternarFormulario('registro')">Não tem conta? Criar conta</button>
                    <button type="button" onclick="alert('Instruções para redefinição de senha foram enviadas ao seu e-mail.')">Esqueci a senha</button>
                </div>
            </div>
        </div>

        <div id="area-escrever-comentario" class="auth-box" style="display: none;">
            <h4>Escrevendo como: <strong id="usuario-logado-nome">...</strong></h4>
            <textarea id="texto-novo-comentario" class="form-input" rows="4" placeholder="O que você achou deste artigo?"></textarea>
            <button class="btn-primary" onclick="enviarComentario()" style="background-color: #10b981;">Publicar Comentário</button>
            <div class="auth-links">
                <button type="button" onclick="deslogarSupabase()" style="color: #ef4444;">Sair da conta</button>
            </div>
        </div>

        <div id="lista-comentarios">
            <h4 style="color: #0f172a; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between;">
                Comentários
                <span id="secao-contador-comentarios" class="badge-contador">0</span>
            </h4>
            <div id="comentarios-render">
                <p style="color: #64748b; font-size: 0.9rem;">Carregando comentários...</p>
            </div>
        </div>
    </section>

    <footer>&copy; 2026 QualProcessador - Editoriais de Alta Performance.</footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const supabaseUrl = 'https://sterozqxsblanvjyzjmi.supabase.co';
            const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0ZXJvenF4c2JsYW52anl6am1pIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4Mzc5Nzc5MCwiZXhwIjoyMDk5MzczNzkwfQ.LnU1u7jpLt69Ia8UEsrF5_RBlQbS2f5GL386OansCEs';
            
            let supabase = null;
            try {
                if (window.supabase) {
                    supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
                } else {
                    console.warn("Aviso: O SDK do Supabase não foi carregado.");
                }
            } catch (e) {
                console.error("Erro ao iniciar Supabase:", e);
            }

            let usuarioAtual = null;
            let idArtigoAtualGlobal = null;

            const mainContainer = document.getElementById('conteudo-artigo-dinamico');
            
            const parametrosUrl = new URLSearchParams(window.location.search);
            let idArtigoUrl = parametrosUrl.get('id');

            if (!idArtigoUrl) {
                const pathSegments = window.location.pathname.split('/').filter(Boolean);
                if (pathSegments.length > 0) {
                    idArtigoUrl = pathSegments[pathSegments.length - 1];
                }
            }

            fetch('artigos.json')
                .then(response => {
                    if (!response.ok) throw new Error('Não foi possível carregar o arquivo artigos.json.');
                    return response.json();
                })
                .then(todosArtigos => {
                    let artigoSelecionado = null;
                    let chaveEncontrada = null;

                    if (idArtigoUrl && todosArtigos[idArtigoUrl]) {
                        artigoSelecionado = todosArtigos[idArtigoUrl];
                        chaveEncontrada = idArtigoUrl;
                    } else if (idArtigoUrl) {
                        for (const chave in todosArtigos) {
                            const art = todosArtigos[chave];
                            if (art.urlLimpa && art.urlLimpa.includes(idArtigoUrl)) {
                                artigoSelecionado = art;
                                chaveEncontrada = chave;
                                break;
                            }
                        }
                    }

                    if (artigoSelecionado && chaveEncontrada) {
                        idArtigoAtualGlobal = chaveEncontrada;
                        
                        configurarSEO(artigoSelecionado.titulo, artigoSelecionado.descricao);
                        renderizarHtml(artigoSelecionado);

                        try {
                            if (artigoSelecionado.urlLimpa && !window.location.pathname.includes(artigoSelecionado.urlLimpa)) {
                                window.history.replaceState(null, '', artigoSelecionado.urlLimpa);
                            }
                        } catch (err) {
                            console.warn("Não foi possível substituir a URL via history API.");
                        }
                    } else {
                        exibirErro("O artigo solicitado não foi encontrado no banco de dados.");
                    }
                })
                .catch(error => {
                    console.error('Erro ao buscar dados:', error);
                    exibirErro("Erro ao carregar o conteúdo. Verifique o arquivo artigos.json.");
                });

            function renderizarHtml(artigo) {
                if (!mainContainer) return;
                let htmlCapa = artigo.imagemCapa 
                    ? `<img src="${artigo.imagemCapa}" class="cover-img" alt="${artigo.titulo}">` 
                    : '';

                mainContainer.innerHTML = `
                    <article>
                        <header class="article-header">
                            <span class="meta-category">${artigo.categoria}</span>
                            <h1 class="article-title">${artigo.titulo}</h1>
                            <div class="article-meta-info">
                                <div class="author-avatar">QP</div>
                                <div>
                                    Publicado por <strong>${artigo.autor}</strong> • ⏱️ Leitura: ${artigo.tempoLeitura} • 💬 <a href="#secao-comentarios" class="link-comentarios-topo"><span id="topo-contador-comentarios">0</span> Comentários</a>
                                </div>
                            </div>
                        </header>

                        <div class="article-container">
                            ${htmlCapa}
                            <div class="article-body">
                                ${artigo.texto}
                            </div>
                        </div>
                    </article>
                `;

                const secaoComentarios = document.getElementById('secao-comentarios');
                if (secaoComentarios) secaoComentarios.style.display = 'block';
                
                verificarSessao();
                window.carregarComentarios();
            }

            function exibirErro(mensagem) {
                if (!mainContainer) return;
                mainContainer.innerHTML = `
                    <div class="article-container" style="text-align: center; margin-top: 100px;">
                        <h2>Artigo Não Encontrado</h2>
                        <p style="color: #ef4444; font-weight: 600;">${mensagem}</p>
                        <a href="analises.html" style="color: #0284c7; font-weight: bold; text-decoration: underline;">Voltar ao Hub de Análises</a>
                    </div>
                `;
            }

            function configurarSEO(titulo, descricao) {
                document.title = `${titulo} - QualProcessador`;
                if(descricao) {
                    let metaDesc = document.querySelector('meta[name="description"]');
                    if(metaDesc) metaDesc.setAttribute('content', descricao);
                }
            }

            // --- AUTENTICAÇÃO ---
            function verificarSessao() {
                if (!supabase) return;
                const sessaoSalva = JSON.parse(localStorage.getItem('qp_user_session'));
                atualizarInterfaceSessao(sessaoSalva);
            }

            function atualizarInterfaceSessao(user) {
                usuarioAtual = user;
                const authContainer = document.getElementById('auth-container');
                const areaEscrever = document.getElementById('area-escrever-comentario');
                
                if (!authContainer || !areaEscrever) return;

                if (user) {
                    authContainer.style.display = 'none';
                    areaEscrever.style.display = 'block';
                    const nomeEl = document.getElementById('usuario-logado-nome');
                    if (nomeEl) nomeEl.innerText = user.username || user.email;
                } else {
                    authContainer.style.display = 'block';
                    areaEscrever.style.display = 'none';
                }
            }

            window.alternarFormulario = function(tela) {
                const reg = document.getElementById('form-registro');
                const log = document.getElementById('form-login');
                if(reg && log) {
                    reg.style.display = tela === 'registro' ? 'block' : 'none';
                    log.style.display = tela === 'login' ? 'block' : 'none';
                }
            }

            window.criarContaSupabase = async function() {
                if (!supabase) return alert("Banco de dados indisponível.");
                const email = document.getElementById('reg-email')?.value.trim();
                const username = document.getElementById('reg-username')?.value.trim();
                const password = document.getElementById('reg-senha')?.value;

                if(!email || !username || !password) return alert("Preencha todos os campos!");

                let { data: existente } = await supabase.from('usuarios').select('id').eq('email', email).maybeSingle();
                if (existente) return alert('Este endereço de e-mail já está em uso.');

                const novoUser = { username, email, password: password, role: 'user', avatar: '' };
                const { error } = await supabase.from('usuarios').insert([novoUser]);

                if (error) {
                    alert("Erro ao criar conta: " + error.message);
                } else {
                    alert("Conta criada com sucesso! Faça login para prosseguir.");
                    const senhaEl = document.getElementById('reg-senha');
                    if(senhaEl) senhaEl.value = '';
                    alternarFormulario('login');
                }
            }

            window.logarSupabase = async function() {
                if (!supabase) return alert("Banco de dados indisponível.");
                const email = document.getElementById('log-email')?.value.trim();
                const password = document.getElementById('log-senha')?.value;

                if(!email || !password) return alert("Preencha e-mail e senha!");

                let { data: usuarioValido, error } = await supabase
                    .from('usuarios')
                    .select('*')
                    .eq('email', email)
                    .eq('password', password)
                    .maybeSingle();

                if (error || !usuarioValido) {
                    return alert('Credenciais incorretas.');
                }

                localStorage.setItem('qp_user_session', JSON.stringify(usuarioValido));
                const senhaEl = document.getElementById('log-senha');
                if(senhaEl) senhaEl.value = '';
                verificarSessao();
                window.carregarComentarios();
            }

            window.deslogarSupabase = function() {
                localStorage.removeItem('qp_user_session');
                verificarSessao();
                window.carregarComentarios();
            }

            // --- SISTEMA DE COMENTÁRIOS E THREADS ---
            window.carregarComentarios = async function() {
                if (!supabase || !idArtigoAtualGlobal) return;
                const container = document.getElementById('comentarios-render');
                if (!container) return;

                container.innerHTML = '<p class="no-comments">Carregando discussões...</p>';

                let { data: comentariosSalvos, error } = await supabase
                    .from('comentarios_produto')
                    .select('*')
                    .eq('id_post', String(idArtigoAtualGlobal))
                    .order('id', { ascending: true });

                if (error) {
                    container.innerHTML = '<p class="no-comments" style="color:#ef4444;">Erro ao carregar comentários.</p>';
                    return;
                }
                
                // ATUALIZA OS CONTADORES DE COMENTÁRIOS
                const totalComentarios = comentariosSalvos ? comentariosSalvos.length : 0;
                const topoContador = document.getElementById('topo-contador-comentarios');
                const secaoContador = document.getElementById('secao-contador-comentarios');
                if(topoContador) topoContador.innerText = totalComentarios;
                if(secaoContador) secaoContador.innerText = totalComentarios;

                container.innerHTML = '';
                if (!comentariosSalvos || comentariosSalvos.length === 0) {
                    container.innerHTML = '<p class="no-comments">Nenhum comentário registrado ainda. Seja o primeiro a comentar!</p>';
                    return;
                }

                const logado = JSON.parse(localStorage.getItem('qp_user_session'));

                const principais = comentariosSalvos.filter(c => !c.parent_id);
                const respostas = comentariosSalvos.filter(c => c.parent_id);

                principais.reverse().forEach(c => {
                    renderizarItemComentario(c, false, logado, c.id);
                    const filhas = respostas.filter(r => r.parent_id === c.id);
                    filhas.forEach(f => renderizarItemComentario(f, true, logado, c.id));
                });
            }

            function renderizarItemComentario(c, ehResposta, logado, idPrincipal) {
                const container = document.getElementById('comentarios-render');
                
                const ehDono = logado && logado.username.toLowerCase() === c.autor.toLowerCase();
                const ehAdmin = logado && logado.role === 'admin';
                const temPermissao = ehDono || ehAdmin;

                const badgeAdmin = c.autor_role === 'admin' ? '<span style="color:#0ea5e9; font-size:0.75em; font-weight:bold; margin-left:4px; background:#e0f2fe; padding:2px 6px; border-radius:4px;">[ADM]</span>' : '';
                const badgeEditado = c.editado ? '<span style="color:#94a3b8; font-size:0.8em; font-style:italic; margin-left:6px;">(editado)</span>' : '';
                const dataFormatada = c.data && c.data.includes('/') ? c.data : new Date(c.data || Date.now()).toLocaleDateString('pt-BR', { hour: '2-digit', minute: '2-digit' });

                const div = document.createElement('div');
                div.className = `comment-item ${ehResposta ? 'reply' : ''}`;
                
                div.innerHTML = `
                    <div class="comment-header">
                        <div class="comment-author-info">
                            <div class="author-avatar">${c.autor_avatar || c.autor.substring(0,2).toUpperCase()}</div>
                            <div>
                                <span class="comment-author">${c.autor} ${badgeAdmin}</span>
                                <div class="comment-date">${dataFormatada} ${badgeEditado}</div>
                            </div>
                        </div>
                    </div>
                    <p class="comment-body" id="texto-comentario-${c.id}">${c.conteudo}</p>
                    <div class="comment-actions">
                        ${logado ? `<button onclick="abrirFormResposta(${c.id}, ${idPrincipal})">Responder</button>` : ''}
                        ${temPermissao ? `<button onclick="editarComentario(${c.id})">Editar</button>` : ''}
                        ${temPermissao ? `<button class="btn-delete" onclick="excluirComentario(${c.id})">Apagar</button>` : ''}
                    </div>
                    <div id="reply-box-${c.id}" style="margin-top:10px;"></div>
                    <div id="edit-box-${c.id}" style="margin-top:10px;"></div>
                `;
                container.appendChild(div);
            }

            window.enviarComentario = async function() {
                if (!supabase) return alert("Banco de dados indisponível.");
                const textarea = document.getElementById('texto-novo-comentario');
                const conteudo = textarea ? textarea.value.trim() : '';
                if (!conteudo) return alert("Escreva algo antes de publicar.");

                const novoComentario = {
                    id_post: String(idArtigoAtualGlobal),
                    autor: usuarioAtual?.username || "Leitor",
                    autor_avatar: usuarioAtual?.avatar || '',
                    autor_role: usuarioAtual?.role || 'user',
                    conteudo: conteudo,
                    data: new Date().toLocaleDateString('pt-BR', { hour: '2-digit', minute: '2-digit' })
                };

                const { error } = await supabase.from('comentarios_produto').insert([novoComentario]);

                if (error) {
                    alert("Erro ao enviar: " + error.message);
                } else {
                    if(textarea) textarea.value = '';
                    window.carregarComentarios();
                }
            }

            window.abrirFormResposta = function(idAlvo, idPrincipal) {
                const box = document.getElementById(`reply-box-${idAlvo}`);
                box.innerHTML = `
                    <div style="display:flex; gap:8px; flex-direction:column;">
                        <textarea id="reply-text-${idAlvo}" rows="2" placeholder="Escreva sua resposta..." style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; font-family:inherit; font-size:0.9rem; outline:none;"></textarea>
                        <div style="display:flex; gap:8px;">
                            <button onclick="enviarResposta(${idAlvo}, ${idPrincipal})" style="background:#10b981; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-weight:bold; font-size:0.8rem;">Enviar Resposta</button>
                            <button onclick="carregarComentarios()" style="background:#e2e8f0; color:#0f172a; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-weight:bold; font-size:0.8rem;">Cancelar</button>
                        </div>
                    </div>
                `;
            }

            window.enviarResposta = async function(idAlvo, idPrincipal) {
                const texto = document.getElementById(`reply-text-${idAlvo}`).value.trim();
                if (!texto || !usuarioAtual) return;

                const resposta = {
                    id_post: String(idArtigoAtualGlobal),
                    parent_id: idPrincipal,
                    autor: usuarioAtual.username,
                    autor_avatar: usuarioAtual.avatar || '',
                    autor_role: usuarioAtual.role || 'user',
                    conteudo: texto,
                    data: new Date().toLocaleDateString('pt-BR', { hour: '2-digit', minute: '2-digit' })
                };

                const { error } = await supabase.from('comentarios_produto').insert([resposta]);
                if (error) {
                    alert("Erro ao enviar resposta: " + error.message);
                    return;
                }
                window.carregarComentarios();
            }

            window.excluirComentario = async function(idComentario) {
                if (confirm("Deseja apagar este comentário permanentemente?")) {
                    await supabase.from('comentarios_produto').delete().eq('id', idComentario);
                    window.carregarComentarios();
                }
            }

            window.editarComentario = function(idComentario) {
                const pTexto = document.getElementById(`texto-comentario-${idComentario}`);
                const original = pTexto.innerText;
                const editBox = document.getElementById(`edit-box-${idComentario}`);

                editBox.innerHTML = `
                    <textarea id="edit-input-${idComentario}" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; font-family:inherit; font-size:0.9rem; outline:none;" rows="3">${original}</textarea>
                    <div style="display:flex; gap:8px; margin-top:6px;">
                        <button onclick="salvarEdicao(${idComentario})" style="background:#3b82f6; color:white; border:none; border-radius:4px; padding:6px 12px; font-weight:bold; font-size:0.8rem; cursor:pointer;">Salvar Edição</button>
                        <button onclick="carregarComentarios()" style="background:#e2e8f0; color:#0f172a; border:none; border-radius:4px; padding:6px 12px; font-weight:bold; font-size:0.8rem; cursor:pointer;">Cancelar</button>
                    </div>
                `;
                pTexto.style.display = 'none';
            }

            window.salvarEdicao = async function(idComentario) {
                const novoTexto = document.getElementById(`edit-input-${idComentario}`).value.trim();
                if (!novoTexto) return;

                const { error } = await supabase.from('comentarios_produto').update({ 
                    conteudo: novoTexto,
                    editado: true 
                }).eq('id', idComentario);
                
                if (error) {
                    alert("Erro ao salvar edição: " + error.message);
                    return;
                }
                
                window.carregarComentarios();
            }
        });
    </script>
</body>
</html>
